<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="天繃開橘">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<title>天繃開橘</title>
<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --text:#1c1a17; --sub:#8a8378;
    --border:#eae6df; --accent:#c9622c; --accent-soft:#f2e2d6;
    --good:#3a8f5c; --warn:#b8791f; --bad:#c14444;
    --radius:16px; --radius-lg:20px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(28,26,23,.04), 0 1px 8px rgba(28,26,23,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141210; --card:#1d1a17; --text:#f2ede6; --sub:#95897c;
      --border:#2c2823; --accent:#e2895a; --accent-soft:#3a2a1e;
      --good:#5fbf87; --warn:#e0a64a; --bad:#ef7272;
      --shadow:0 1px 8px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{
    padding: max(16px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    min-height:100vh;
    max-width:560px; margin:0 auto;
  }
  button, input{ font-family:inherit; }

  /* ---- header ---- */
  .topbar{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px;}
  .topbar h1{font-size:20px; margin:0; font-weight:800; letter-spacing:.2px;}
  .topbar .sub{font-size:12.5px; color:var(--sub); margin-top:3px;}
  .iconbtn{
    width:38px; height:38px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    font-size:16px; color:var(--sub); flex-shrink:0;
  }
  .iconbtn:active{opacity:.6;}
  .iconbtn.spin{animation:spin .7s linear;}
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  /* ---- mode switch ---- */
  .modeSwitch{
    display:flex; background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:4px; margin-bottom:6px; gap:4px;
  }
  .modeBtn{
    flex:1; border:none; background:transparent; color:var(--sub); font-weight:700;
    font-size:14px; padding:10px 8px; border-radius:10px; transition:background .15s, color .15s;
  }
  .modeBtn.active{ background:var(--accent); color:#fff; }
  .updatedRow{ text-align:center; font-size:11.5px; color:var(--sub); margin:8px 0 16px; }
  .updatedRow button{ background:none; border:none; color:var(--accent); font-weight:700; font-size:11.5px; padding:2px 6px; }

  /* ---- section ---- */
  .section-title{font-size:12.5px; font-weight:800; color:var(--sub); margin:20px 2px 8px; letter-spacing:.4px; text-transform:uppercase;}

  /* ---- krtc station tabs ---- */
  .krtcTabs{ display:flex; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:3px; gap:3px; }
  .krtcTabBtn{ flex:1; border:none; background:transparent; color:var(--sub); font-weight:700; font-size:12.5px; padding:8px 4px; border-radius:9px; }
  .krtcTabBtn.active{ background:var(--card); color:var(--text); box-shadow:var(--shadow); }

  /* ---- hero (TRA) ---- */
  .hero{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px; margin-bottom:8px; box-shadow:var(--shadow); position:relative;
    border-left:4px solid var(--accent);
  }
  .hero-label{font-size:11.5px; font-weight:800; color:var(--accent); letter-spacing:.5px; text-transform:uppercase;}
  .hero-route{font-size:19px; font-weight:800; margin-top:3px;}
  .hero-trains{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
  .hero-train{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 13px;
    cursor:pointer;

  .hero-train:active{opacity:.65;}
  .hero-train .l{font-size:13.5px; font-weight:600;}
  .hero-train .l small{display:block; font-size:11.5px; color:var(--sub); font-weight:500; margin-top:2px;}
  .hero-train .r{font-size:19px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums; color:var(--accent);}
  .hero-empty{margin-top:14px; font-size:13px; color:var(--sub);}

  /* ---- generic card ---- */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .card-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .card-title{display:flex; align-items:center; gap:10px; min-width:0;}
  .tag{
    font-size:11px; font-weight:800; color:#fff; border-radius:7px; padding:4px 8px;

  .card-name{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-sub{font-size:12px; color:var(--sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gearbtn{background:var(--bg); border:1px solid var(--border); color:var(--sub); font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:8px; flex-shrink:0;}
  .gearbtn:active{opacity:.6;}
  .card.clickable{cursor:pointer;}
  .card.clickable:active{opacity:.75;}
  .clickable{cursor:pointer;}
  .clickable:active{opacity:.7;}
  .chev{color:var(--sub); font-size:18px; flex-shrink:0;}
  .card.addroute{cursor:pointer; text-align:center; border-style:dashed; color:var(--accent); font-weight:700; font-size:14px;}
  .card.addroute:active{opacity:.6;}

  .etalist{display:flex; gap:8px; margin-top:11px; flex-wrap:wrap;}
  .eta{
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 12px; min-width:64px; text-align:center;
  }
  .eta .min{font-size:17px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums;}
  .eta .min.soon{color:var(--good);}
  .eta .min.late{color:var(--sub);}
  .eta .cap{font-size:10.5px; color:var(--sub); margin-top:2px;}

  .muted{color:var(--sub); font-size:13px; padding:8px 2px;}
  .err{color:var(--bad); font-size:12.5px; padding:8px 2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .err button{background:var(--bad); color:#fff; border:none; border-radius:8px; font-size:11.5px; font-weight:700; padding:5px 10px;}
  .skeleton{height:44px; border-radius:var(--radius-sm); background:linear-gradient(90deg, var(--bg) 25%, var(--border) 37%, var(--bg) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite;}
  @keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:0 0} }

  .footer{text-align:center; color:var(--sub); font-size:11.5px; margin-top:22px; line-height:1.7;}

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,18,16,.5); display:none;
    align-items:flex-end; z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card); width:100%; max-height:82vh; border-radius:22px 22px 0 0;
    padding:16px 18px calc(18px + env(safe-area-inset-bottom)); overflow-y:auto;
    animation:up .2s ease-out; max-width:560px; margin:0 auto;
  }
  @keyframes up{from{transform:translateY(20px); opacity:.4} to{transform:translateY(0); opacity:1}}
  .sheet h2{font-size:16.5px; margin:0 0 4px; font-weight:800;}
  .sheet p.hint{font-size:12.5px; color:var(--sub); margin:0 0 12px;}
  .stopitem{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px; border-bottom:1px solid var(--border); font-size:14px;
  }
  .stopitem .n{font-weight:600;}
  .stopitem .d{font-size:11.5px; color:var(--sub); margin-top:1px;}
  .stopitem button{
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    font-size:12px; padding:7px 13px; font-weight:700; flex-shrink:0;
  }
  .stopitem button:disabled{ background:var(--border); color:var(--sub); }
  .stopitem.picked button{background:var(--good);}
  .closebar{display:flex; justify-content:flex-end; margin-bottom:4px;}
  .closebar button{background:none; border:none; color:var(--sub); font-size:14px; padding:8px;}
  .searchRow{ display:flex; gap:8px; margin-bottom:12px; }
  .searchRow input{
    flex:1; min-width:0; padding:11px 13px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px;
  }
  .searchRow button{
    background:var(--accent); color:#fff; border:none; border-radius:12px; padding:0 18px;
    font-weight:700; flex-shrink:0; font-size:14px;
  }
</style>

<script>
/* ====================== 設定區 ====================== */
const TDX_CLIENT_ID = 'M144040015-6d10b8c1-4e17-4a74';
const TDX_CLIENT_SECRET = 'cff4b35c-2152-4564-a5f5-dcd38c8608ec';
const TDX_AUTH_URL = 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
const TDX_API = 'https://tdx.transportdata.tw/api/basic';

const TRA_STATIONS = { KAOHSIUNG: '4400', PINGTUNG: '5000' };
// Direction 1 = 南下(高雄→屏東方向), Direction 0 = 北上(屏東→高雄方向)
const TRA_DIRECTIONS = {
  go:   { fromStation: TRA_STATIONS.PINGTUNG,  direction: 0, label: '屏東 → 高雄' },
  back: { fromStation: TRA_STATIONS.KAOHSIUNG, direction: 1, label: '高雄 → 屏東' }
};

// 不分去程／回程，哈瑪星、美麗島、高雄車站三站都能選。
// 美麗島是橘線／紅線的轉乘站，橘線那側叫 O5、紅線那側叫 R10，兩個 ID 都要查才會抓到雙線的班次。
const KRTC_STATIONS = [
  { key:'hamasen',  name:'哈瑪星',   ids:['O1'],       line:'橘線' },
  { key:'meilidao', name:'美麗島',   ids:['O5','R10'], line:'橘線・紅線' },
  { key:'kstation', name:'高雄車站', ids:['R11'],      line:'紅線' }
];
const KRTC_ALL_STATION_IDS = KRTC_STATIONS.flatMap(s=>s.ids);
function krtcDefaultStation(){
  return getMode()==='go' ? 'hamasen' : 'kstation';
}
let selectedKrtcStation = 'hamasen'; // 會在 currentMode 初始化後由 krtcDefaultStation() 校正

const DEFAULT_BUS_ROUTES = [
  { key:'o1',  name:'橘1',      tag:'橘1',   color:'#d98a2b' },
  { key:'o1e', name:'橘1延',    tag:'橘1延', color:'#e0a64a' },
  { key:'r52', name:'紅52',     tag:'紅52',  color:'#c1443f' },
  { key:'w50', name:'50五福幹線', tag:'五福幹線', color:'#7c6fae' }
];
const ROUTE_COLORS = ['#d98a2b','#c1443f','#7c6fae','#3a8f9e','#3a8f5c','#b8791f','#b85c86','#4472c4'];

function getBusRoutes(){
  const saved = JSON.parse(localStorage.getItem('busRoutes') || 'null');
  if(saved) return saved;
  localStorage.setItem('busRoutes', JSON.stringify(DEFAULT_BUS_ROUTES));
  return DEFAULT_BUS_ROUTES.slice();
}
function saveBusRoutes(list){
  localStorage.setItem('busRoutes', JSON.stringify(list));
}
function addBusRoute(name){
  const list = getBusRoutes();
  if(list.some(r=>r.name===name)) return;
  const color = ROUTE_COLORS[list.length % ROUTE_COLORS.length];
  const key = 'r_' + Date.now();
  list.push({ key, name, tag:name, color });
  saveBusRoutes(list);
}
function removeBusRoute(key){
  saveBusRoutes(getBusRoutes().filter(r=>r.key!==key));
  localStorage.removeItem('busStop_'+key+'_go');
  localStorage.removeItem('busStop_'+key+'_back');
}

/* ====================== 去程／回程模式 ====================== */
function autoDetectMode(){
  const h = new Date().getHours();
  return h < 13 ? 'go' : 'back';
}
let currentMode = autoDetectMode();
selectedKrtcStation = krtcDefaultStation();
function getMode(){ return currentMode; }
function setMode(m){
  currentMode = m;
  selectedKrtcStation = krtcDefaultStation();
  renderModeUI();
  renderAll();
  refreshAll();
}
function renderModeUI(){
  document.querySelectorAll('.modeBtn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.mode === currentMode);
  });
  const hints = {
    go:   '出發囉，往高雄方向',
    back: '收工，往屏東方向回家'
  };
  document.getElementById('modeHint').textContent = hints[currentMode];
}

/* ====================== Token ====================== */
async function getToken(){
  const cached = JSON.parse(localStorage.getItem('tdx_token') || 'null');
  if (cached && cached.expiresAt > Date.now() + 60000) return cached.token;
  const res = await fetch(TDX_AUTH_URL, {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({
      grant_type:'client_credentials',
      client_id:TDX_CLIENT_ID,
      client_secret:TDX_CLIENT_SECRET
    })
  });
  if(!res.ok) throw new Error('TDX 授權失敗');
  const json = await res.json();
  const data = { token: json.access_token, expiresAt: Date.now() + json.expires_in*1000 };
  localStorage.setItem('tdx_token', JSON.stringify(data));
  return data.token;
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

// 全站唯一的請求佇列：所有 tdxGet 呼叫（不論來自定時刷新、手動刷新，
// 還是彈窗裡的查詢）都會被排成一直線，強制間隔發送，
// 從根本上避免短時間內同時打出多個請求觸發 TDX 的流量限制。
const REQUEST_GAP_MS = 700;
let lastRequestAt = 0;
let requestQueue = Promise.resolve();

function queueRequest(task){
  const run = async ()=>{
    const wait = Math.max(0, REQUEST_GAP_MS - (Date.now() - lastRequestAt));
    if(wait > 0) await sleep(wait);
    lastRequestAt = Date.now();
    return task();
  };
  const result = requestQueue.then(run, run);
  requestQueue = result.then(()=>{}, ()=>{}); // 就算失敗也讓佇列繼續往下跑
  return result;
}

async function tdxGetRaw(path){
  const token = await getToken();
  const res = await fetch(TDX_API + path + (path.includes('?')?'&':'?') + '$format=JSON', {
    headers:{ Authorization:'Bearer '+token, Accept:'application/json' }
  });
  if(res.status === 429){
    const err = new Error('查詢太頻繁，稍後再試');
    err.isRateLimit = true;
    throw err;
  }
  if(!res.ok) throw new Error('資料取得失敗 ('+res.status+')');
  return res.json();
}

async function tdxGet(path){
  return queueRequest(async ()=>{
    let delay = 1200;
    for(let attempt=0; attempt<4; attempt++){
      try{
        return await tdxGetRaw(path);
      }catch(e){
        if(e.isRateLimit && attempt < 3){
          await sleep(delay);
          delay *= 2;
          continue;
        }
        throw e;
      }
    }
  });
}

/* ====================== 小工具 ====================== */
function minutesFrom(dateStr){
  const diffMs = new Date(dateStr).getTime() - Date.now();
  return Math.max(0, Math.round(diffMs/60000));
}
function fmtMin(m){ return m<=0 ? '進站' : m+'分'; }
function etaClass(m){ return m<=2 ? 'soon' : (m>=15 ? 'late' : ''); }
function nowStr(){
  return new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
}
function errBox(msg, retryFn){
  const id = 'retry_' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>{
    const b = document.getElementById(id);
    if(b) b.onclick = retryFn;
  }, 0);
  return `<div class="err">發生錯誤：${msg} <button id="${id}">重試</button></div>`;
}

/* ====================== 台鐵 ====================== */
async function loadTRA(){
  const el = document.getElementById('traTrains');
  const cfg = TRA_DIRECTIONS[getMode()];
  document.getElementById('traRouteLabel').textContent = cfg.label;
  try{
    const data = await tdxGet(`/v2/Rail/TRA/LiveBoard/Station/${cfg.fromStation}`);
    const trains = (data||[])
      .filter(t => t.Direction === cfg.direction)
      .sort((a,b)=> a.ScheduledDepartureTime.localeCompare(b.ScheduledDepartureTime))
      .slice(0,3);
    if(!trains.length){
      el.innerHTML = '<div class="hero-empty">目前沒有查到班次</div>';
      return;
    }
    el.innerHTML = trains.map(t=>{
      const delay = t.DelayTime>0 ? `誤點 ${t.DelayTime} 分` : '準點';
      return `<div class="hero-train" data-trainno="${t.TrainNo}">
        <div class="l">${t.TrainTypeName.Zh_tw} ${t.TrainNo}
          <small>往${t.EndingStationName.Zh_tw} · ${delay} · 點看時刻表</small>
        </div>
        <div class="r">${t.ScheduledDepartureTime.slice(0,5)}</div>
      </div>`;
    }).join('');
    el.querySelectorAll('.hero-train').forEach(row=>{
      row.onclick = ()=> openTrainDetail(row.dataset.trainno);
    });
  }catch(e){
    el.innerHTML = errBox(e.message, loadTRA);
  }
}

async function openTrainDetail(trainNo){
  document.getElementById('sheetTitle').textContent = '車次 ' + trainNo + ' 時刻表';
  document.getElementById('sheetHint').style.display = 'none';
  const body = document.getElementById('sheetBody');
  body.innerHTML = '<div class="muted">載入中…</div>';
  overlay.classList.add('show');
  try{
    const data = await tdxGet(`/v3/Rail/TRA/GeneralTrainTimetable/TrainNo/${trainNo}`);
    const tt = data && data.TrainTimetables && data.TrainTimetables[0];
    if(!tt){ body.innerHTML = '<div class="muted">查無這班車的時刻表資料</div>'; return; }
    const info = tt.TrainInfo;
    const highlightIds = [TRA_STATIONS.KAOHSIUNG, TRA_STATIONS.PINGTUNG];
    let html = `<p class="hint">${info.TrainTypeName.Zh_tw} ${trainNo} · ${info.StartingStationName.Zh_tw} → ${info.EndingStationName.Zh_tw}${info.Note?(' · '+info.Note):''}</p>`;
    html += (tt.StopTimes||[]).map(s=>{
      const hi = highlightIds.includes(s.StationID);
      return `<div class="stopitem"${hi?' style="color:var(--accent); font-weight:800;"':''}>
        <div><div class="n">${s.StationName.Zh_tw}</div></div>
        <div>${s.DepartureTime || s.ArrivalTime || ''}</div>
      </div>`;
    }).join('');
    body.innerHTML = html;
  }catch(e){
    body.innerHTML = errBox(e.message, ()=>openTrainDetail(trainNo));
  }
}

/* ====================== 高雄捷運 ====================== */
// 注意：KRTC LiveBoard 的 EstimateTime 單位是「分鐘」，不是秒。
function krtcMinuteLabel(m){ return m<=0 ? '進站' : m+'分'; }
const KRTC_TAG_COLOR = { hamasen:'#d98a2b', meilidao:'#7c6fae', kstation:'#c1443f' };

// 三站的即時到站資料只會用「一次」API 請求全部抓回來，
// 之後在哈瑪星／美麗島／高雄車站之間切換分頁完全不用再打 API。
let lastKrtcData = null;

function renderKrtcSkeleton(){
  const wrap = document.getElementById('krtcCards');
  wrap.innerHTML = `
    <div class="card" id="krtc-card">
      <div class="krtcTabs" id="krtcTabs">
        ${KRTC_STATIONS.map(s=>`<button class="krtcTabBtn" data-st="${s.key}">${s.name}</button>`).join('')}
      </div>
      <div class="card-head clickable" id="krtcHead" style="margin-top:12px;">
        <div class="card-title">
          <span class="tag" id="krtcTag"></span>
          <div>
            <div class="card-name" id="krtcStationName"></div>
            <div class="card-sub">點看站點時刻表與地址</div>
          </div>
        </div>
        <span class="chev">›</span>
      </div>
      <div class="etalist" id="krtc-eta"><div class="skeleton"></div></div>
    </div>
  `;
  document.querySelectorAll('.krtcTabBtn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      selectedKrtcStation = btn.dataset.st;
      renderKrtcTabsUI();
      renderKrtcFromCache();
    };
  });
  document.getElementById('krtcHead').onclick = ()=> openKrtcDetail(selectedKrtcStation);
  renderKrtcTabsUI();
}

function renderKrtcTabsUI(){
  document.querySelectorAll('.krtcTabBtn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.st === selectedKrtcStation);
  });
  const st = KRTC_STATIONS.find(s=>s.key===selectedKrtcStation);
  const tag = document.getElementById('krtcTag');
  tag.textContent = st.line;
  tag.style.background = KRTC_TAG_COLOR[st.key];
  document.getElementById('krtcStationName').textContent = st.name + ' 站';
}

function renderKrtcFromCache(){
  const box = document.getElementById('krtc-eta');
  if(!box) return;
  if(!lastKrtcData){ box.innerHTML = '<div class="skeleton"></div>'; return; }
  const st = KRTC_STATIONS.find(s=>s.key===selectedKrtcStation);
  const trains = lastKrtcData.filter(t=> st.ids.includes(t.StationID));
  const byHead = {};
  trains.forEach(t=>{
    if(!(t.TripHeadSign in byHead) || t.EstimateTime < byHead[t.TripHeadSign].EstimateTime){
      byHead[t.TripHeadSign] = t;
    }
  });
  const list = Object.values(byHead).sort((a,b)=> a.EstimateTime - b.EstimateTime);
  if(!list.length){ box.innerHTML = '<div class="muted">目前沒有班次資訊</div>'; return; }
  box.innerHTML = list.map(t=>{
    const m = t.EstimateTime; // 已經是分鐘
    return `<div class="eta">
      <div class="min ${etaClass(m)}">${krtcMinuteLabel(m)}</div>
      <div class="cap">${t.TripHeadSign}</div>
    </div>`;
  }).join('');
}

async function loadKRTC(){
  const box = document.getElementById('krtc-eta');
  if(!box) return;
  try{
    const filter = KRTC_ALL_STATION_IDS.map(id=>`StationID eq '${id}'`).join(' or ');
    const data = await tdxGet(`/v2/Rail/Metro/LiveBoard/KRTC?$filter=${encodeURIComponent(filter)}`);
    lastKrtcData = data || [];
    renderKrtcFromCache();
  }catch(e){
    box.innerHTML = errBox(e.message, loadKRTC);
  }
}

const krtcStationInfoCache = {};
async function getKrtcStationInfo(stationId){
  if(krtcStationInfoCache[stationId]) return krtcStationInfoCache[stationId];
  const cached = JSON.parse(localStorage.getItem('krtcInfo_'+stationId) || 'null');
  if(cached){ krtcStationInfoCache[stationId] = cached; return cached; }
  const data = await tdxGet(`/v2/Rail/Metro/Station/KRTC?$filter=${encodeURIComponent(`StationID eq '${stationId}'`)}`);
  const info = (data && data[0]) || null;
  krtcStationInfoCache[stationId] = info;
  localStorage.setItem('krtcInfo_'+stationId, JSON.stringify(info));
  return info;
}

async function openKrtcDetail(stationKey){
  const st = KRTC_STATIONS.find(s=>s.key===stationKey);
  document.getElementById('sheetTitle').textContent = st.name + ' 站資訊';
  document.getElementById('sheetHint').style.display = 'none';
  const body = document.getElementById('sheetBody');
  body.innerHTML = '<div class="muted">載入中…</div>';
  overlay.classList.add('show');
  try{
    // 站點資訊有本機快取；到站時刻直接沿用最近一次抓到的資料，不額外打 API。
    const infos = await Promise.all(st.ids.map(getKrtcStationInfo));
    const trains = (lastKrtcData||[]).filter(t=> st.ids.includes(t.StationID)).sort((a,b)=> a.EstimateTime - b.EstimateTime);
    let html = '';
    const addr = infos.find(i=>i && i.StationAddress);
    if(addr) html += `<p class="hint">地址：${addr.StationAddress}</p>`;
    html += trains.length ? trains.map(t=>{
      const m = t.EstimateTime;
      return `<div class="stopitem">
        <div><div class="n">${t.TripHeadSign}</div><div class="d">${(t.LineName&&t.LineName.Zh_tw)||''}</div></div>
        <div style="font-weight:800; color:var(--accent);">${krtcMinuteLabel(m)}</div>
      </div>`;
    }).join('') : '<div class="muted">目前沒有班次資訊，請先按重新整理</div>';
    body.innerHTML = html;
  }catch(e){
    body.innerHTML = errBox(e.message, ()=>openKrtcDetail(stationKey));
  }
}

/* ====================== 公車 ====================== */
function getPickedStop(routeKey){
  return JSON.parse(localStorage.getItem('busStop_'+routeKey+'_'+getMode()) || 'null');
}
function setPickedStop(routeKey, mode, stop){
  localStorage.setItem('busStop_'+routeKey+'_'+mode, JSON.stringify(stop));
}

function renderBusSkeleton(){
  const wrap = document.getElementById('busCards');
  const routes = getBusRoutes();
  const modeLabel = getMode()==='go' ? '去程' : '回程';
  wrap.innerHTML = routes.map(r=>{
    const picked = getPickedStop(r.key);
    return `<div class="card" id="bus-${r.key}">
      <div class="card-head">
        <div class="card-title">
          <span class="tag" style="background:${r.color}">${r.tag}</span>
          <div>
            <div class="card-name">${picked ? picked.StopName : modeLabel+'尚未選站牌'}</div>
            <div class="card-sub">${picked ? (modeLabel+'站') : '點齒輪設定'}</div>
          </div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="gearbtn" data-route="${r.key}" data-act="edit">編輯</button>
          <button class="gearbtn" data-route="${r.key}" data-act="del">刪除</button>
        </div>
      </div>
      <div class="etalist" id="bus-eta-${r.key}"><div class="skeleton" style="${picked?'':'display:none;'}"></div>${picked?'':'<div class=\"muted\">尚未設定站牌</div>'}</div>
    </div>`;
  }).join('') + `
    <div class="card addroute" id="addRouteCard">＋ 新增公車路線</div>`;
  wrap.querySelectorAll('.gearbtn[data-act="edit"]').forEach(btn=>{
    btn.onclick = ()=> openStopPicker(btn.dataset.route);
  });
  wrap.querySelectorAll('.gearbtn[data-act="del"]').forEach(btn=>{
    btn.onclick = ()=>{
      const r = routes.find(x=>x.key===btn.dataset.route);
      if(confirm(`確定要移除「${r?r.tag:''}」這條路線嗎？（去程／回程站牌都會一起刪除）`)){
        removeBusRoute(btn.dataset.route);
        renderBusSkeleton();
      }
    };
  });
  document.getElementById('addRouteCard').onclick = openAddRoute;
}

function renderBusEtaBox(box, stop){
  if(!box) return;
  if(!stop || stop.StopStatus!==1 || !stop.NextBusTime){
    box.innerHTML = '<div class="muted">目前沒有預估到站資訊</div>';
    return;
  }
  const m = stop.EstimateTime!=null ? Math.round(stop.EstimateTime/60) : minutesFrom(stop.NextBusTime);
  box.innerHTML = `<div class="eta">
      <div class="min ${etaClass(m)}">${fmtMin(m)}</div>
      <div class="cap">預估到站</div>
    </div>`;
}

async function loadBusEta(routeKey){
  const picked = getPickedStop(routeKey);
  const box = document.getElementById('bus-eta-'+routeKey);
  if(!box) return;
  if(!picked){ box.innerHTML = '<div class="muted">尚未設定站牌</div>'; return; }
  try{
    const route = getBusRoutes().find(r=>r.key===routeKey);
    const filter = encodeURIComponent(`RouteName/Zh_tw eq '${route.name}'`);
    const data = await tdxGet(`/v2/Bus/EstimatedTimeOfArrival/City/Kaohsiung?$filter=${filter}`);
    const stop = (data||[]).find(s=> s.StopUID === picked.StopUID);
    renderBusEtaBox(box, stop);
  }catch(e){
    box.innerHTML = errBox(e.message, ()=>loadBusEta(routeKey));
  }
}

async function loadAllBusEta(){
  const routes = getBusRoutes();
  const withStop = [];
  routes.forEach(r=>{
    const picked = getPickedStop(r.key);
    const box = document.getElementById('bus-eta-'+r.key);
    if(!box) return;
    if(!picked){ box.innerHTML = '<div class="muted">尚未設定站牌</div>'; return; }
    withStop.push({ route:r, stop:picked, box });
  });
  if(!withStop.length) return;
  try{
    const filter = withStop.map(x=>`StopUID eq '${x.stop.StopUID}'`).join(' or ');
    const data = await tdxGet(`/v2/Bus/EstimatedTimeOfArrival/City/Kaohsiung?$filter=${encodeURIComponent(filter)}`);
    withStop.forEach(({stop, box})=>{
      const s = (data||[]).find(x=>x.StopUID===stop.StopUID);
      renderBusEtaBox(box, s);
    });
  }catch(e){
    withStop.forEach(({box})=>{ box.innerHTML = errBox(e.message, loadAllBusEta); });
  }
}

/* ---- 站牌選擇 modal ---- */
const overlay = document.getElementById('overlay');
document.getElementById('closeSheet').onclick = ()=> overlay.classList.remove('show');
overlay.onclick = (e)=>{ if(e.target===overlay) overlay.classList.remove('show'); };

async function openStopPicker(routeKey){
  const route = getBusRoutes().find(r=>r.key===routeKey);
  const mode = getMode();
  const modeLabel = mode==='go' ? '去程' : '回程';
  document.getElementById('sheetTitle').textContent = route.name + ' — 選擇' + modeLabel + '站牌';
  const hint = document.getElementById('sheetHint');
  hint.style.display = 'block';
  hint.textContent = `選你${modeLabel}時上車的站牌，之後首頁只顯示這一站的到站時間（去程／回程可各自設定不同站牌）。`;
  const body = document.getElementById('sheetBody');
  body.innerHTML = '<div class="muted">載入中…</div>';
  overlay.classList.add('show');
  try{
    const filter = encodeURIComponent(`RouteName/Zh_tw eq '${route.name}'`);
    const data = await tdxGet(`/v2/Bus/EstimatedTimeOfArrival/City/Kaohsiung?$filter=${filter}`);
    const picked = getPickedStop(routeKey);
    const byDir = {};
    (data||[]).forEach(s=>{
      byDir[s.Direction] = byDir[s.Direction] || [];
      byDir[s.Direction].push(s);
    });
    let html = '';
    Object.keys(byDir).sort().forEach(dir=>{
      const list = byDir[dir].sort((a,b)=>a.StopSequence-b.StopSequence);
      const terminus = list[list.length-1].StopName.Zh_tw;
      html += `<div class="section-title" style="margin-top:14px;">往 ${terminus} 方向</div>`;
      html += list.map(s=>{
        const isPicked = picked && picked.StopUID===s.StopUID;
        return `<div class="stopitem">
          <div>
            <div class="n">${s.StopName.Zh_tw}</div>
            <div class="d">第 ${s.StopSequence} 站</div>
          </div>
          <button data-uid="${s.StopUID}">${isPicked?'已選':'選擇'}</button>
        </div>`;
      }).join('');
    });
    body.innerHTML = html || '<div class="muted">查無站牌資料</div>';
    body.querySelectorAll('button[data-uid]').forEach(btn=>{
      btn.onclick = ()=>{
        const s = data.find(x=>x.StopUID===btn.dataset.uid);
        setPickedStop(routeKey, mode, {
          StopUID: s.StopUID,
          StopName: s.StopName.Zh_tw,
          seq: s.StopSequence
        });
        overlay.classList.remove('show');
        renderBusSkeleton();
        loadBusEta(routeKey);
      };
    });
  }catch(e){
    body.innerHTML = errBox(e.message, ()=>openStopPicker(routeKey));
  }
}

/* ---- 新增路線 ---- */
async function openAddRoute(){
  document.getElementById('sheetTitle').textContent = '新增公車路線';
  document.getElementById('sheetHint').style.display = 'none';
  const body = document.getElementById('sheetBody');
  body.innerHTML = `
    <div class="searchRow">
      <input id="routeSearchInput" type="text" placeholder="輸入路線名稱，例如 88" inputmode="search">
      <button id="routeSearchBtn">搜尋</button>
    </div>
    <div id="routeSearchResults" class="muted">輸入路線名稱後按搜尋（僅限高雄市區公車路線）</div>
  `;
  overlay.classList.add('show');
  const input = document.getElementById('routeSearchInput');
  input.focus();
  const doSearch = async ()=>{
    const kw = input.value.trim();
    const results = document.getElementById('routeSearchResults');
    if(!kw){ results.innerHTML = '<div class="muted">請輸入關鍵字</div>'; return; }
    results.innerHTML = '<div class="muted">搜尋中…</div>';
    try{
      const filter = encodeURIComponent(`contains(RouteName/Zh_tw,'${kw}')`);
      const data = await tdxGet(`/v2/Bus/Route/City/Kaohsiung?$filter=${filter}&$top=15`);
      if(!data || !data.length){ results.innerHTML = '<div class="muted">查無符合的路線</div>'; return; }
      const existing = getBusRoutes().map(r=>r.name);
      results.innerHTML = data.map(r=>{
        const name = r.RouteName.Zh_tw;
        const op = (r.Operators && r.Operators[0] && r.Operators[0].OperatorName.Zh_tw) || '';
        const already = existing.includes(name);
        return `<div class="stopitem">
          <div><div class="n">${name}</div><div class="d">${op}</div></div>
          <button data-name="${name}" ${already?'disabled':''}>${already?'已加入':'加入'}</button>
        </div>`;
      }).join('');
      results.querySelectorAll('button[data-name]').forEach(btn=>{
        btn.onclick = ()=>{
          addBusRoute(btn.dataset.name);
          overlay.classList.remove('show');
          renderBusSkeleton();
          refreshAll();
        };
      });
    }catch(e){
      results.innerHTML = errBox(e.message, doSearch);
    }
  };
  document.getElementById('routeSearchBtn').onclick = doSearch;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
}

/* ====================== 主流程 ====================== */
function renderAll(){
  renderKrtcSkeleton();
  renderBusSkeleton();
}

let isRefreshing = false;
async function refreshAll(){
  if(isRefreshing) return;
  isRefreshing = true;
  const row = document.getElementById('updatedRow');
  row.textContent = '更新中…';
  document.getElementById('refreshBtn').classList.add('spin');
  try{
    // 三組請求都會經過 tdxGet 的全站佇列，自動排隊、間隔發送，
    // 這裡直接平行呼叫即可，不需要再手動加延遲。
    await Promise.all([ loadTRA(), loadKRTC(), loadAllBusEta() ]);
  } finally {
    isRefreshing = false;
    document.getElementById('refreshBtn').classList.remove('spin');
  }
  row.innerHTML = `最後更新 ${nowStr()} <button id="manualRefresh">重新整理</button>`;
  document.getElementById('manualRefresh').onclick = refreshAll;
}

document.getElementById('refreshBtn').onclick = refreshAll;
document.querySelectorAll('.modeBtn').forEach(btn=>{
  btn.onclick = ()=> setMode(btn.dataset.mode);
});

renderModeUI();
renderAll();
refreshAll();

// 每 10 秒觸發一次，但畫面不在前景（螢幕鎖定、切到別的 App）時跳過，
// 不浪費 TDX 的每月查詢額度；回到前景會立刻補一次最新資料。
const AUTO_REFRESH_MS = 10000;
setInterval(()=>{
  if(document.visibilityState === 'visible') refreshAll();
}, AUTO_REFRESH_MS);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') refreshAll();
});
</script>
</body>
</html>
