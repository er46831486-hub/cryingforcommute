<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-title" content="天繃開橘">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<title>天繃開橘</title>
<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --text:#1c1a17; --sub:#8a8378;
    --border:#eae6df; --accent:#c9622c; --accent-soft:#f2e2d6;
    --good:#3a8f5c; --warn:#b8791f; --bad:#c14444;
    --radius:16px; --radius-lg:20px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(28,26,23,.04), 0 1px 8px rgba(28,26,23,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141210; --card:#1d1a17; --text:#f2ede6; --sub:#95897c;
      --border:#2c2823; --accent:#e2895a; --accent-soft:#3a2a1e;
      --good:#5fbf87; --warn:#e0a64a; --bad:#ef7272;
      --shadow:0 1px 8px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{
    padding: max(16px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    min-height:100vh;
    max-width:560px; margin:0 auto;
  }
  button, input{ font-family:inherit; }

  /* ---- header ---- */
  .topbar{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px;}
  .topbar h1{font-size:20px; margin:0; font-weight:800; letter-spacing:.2px;}
  .topbar .sub{font-size:12.5px; color:var(--sub); margin-top:3px;}
  .iconbtn{
    width:38px; height:38px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    font-size:16px; color:var(--sub); flex-shrink:0;
  }
  .iconbtn:active{opacity:.6;}
  .iconbtn.spin{animation:spin .7s linear;}
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  /* ---- mode switch ---- */
  .modeSwitch{
    display:flex; background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:4px; margin-bottom:6px; gap:4px;
  }
  .modeBtn{
    flex:1; border:none; background:transparent; color:var(--sub); font-weight:700;
    font-size:14px; padding:10px 8px; border-radius:10px; transition:background .15s, color .15s;
  }
  .modeBtn.active{ background:var(--accent); color:#fff; }
  .updatedRow{ text-align:center; font-size:11.5px; color:var(--sub); margin:8px 0 16px; }
  .updatedRow button{ background:none; border:none; color:var(--accent); font-weight:700; font-size:11.5px; padding:2px 6px; }

  /* ---- section ---- */
  .section-title{font-size:12.5px; font-weight:800; color:var(--sub); margin:20px 2px 8px; letter-spacing:.4px; text-transform:uppercase; display:flex; align-items:center; gap:6px;}
  .sectionIcon{display:inline-flex; color:var(--accent); flex-shrink:0;}
  .sectionIcon svg{width:15px; height:15px;}
  .hero-label{display:flex; align-items:center; gap:6px;}
  .staleNote{width:100%; font-size:10.5px; color:var(--warn); margin-top:6px;}
  .rangeBtn{background:var(--bg); border:1px solid var(--border); color:var(--sub); font-size:11.5px; font-weight:700; padding:7px 11px; border-radius:9px; flex-shrink:0;}
  .rangeBtn:active{opacity:.6;}
  .locateBtn{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:13px;}
  .locateBtn:active{opacity:.75;}
  .timeRow{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .timeRow input[type=time]{
    flex:1; padding:10px 12px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px;
  }
  .timeRow span{color:var(--sub); font-size:13px; flex-shrink:0;}
  .fullBtn{
    width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:12px; font-weight:700; font-size:14px;
  }
  .fullBtn:active{opacity:.75;}

  /* ---- krtc station tabs ---- */
  .krtcTabs{ display:flex; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:3px; gap:3px; }
  .krtcTabBtn{ flex:1; border:none; background:transparent; color:var(--sub); font-weight:700; font-size:12.5px; padding:8px 4px; border-radius:9px; }
  .krtcTabBtn.active{ background:var(--card); color:var(--text); box-shadow:var(--shadow); }

  /* ---- hero (TRA) ---- */
  .hero{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px 18px 16px; margin-bottom:8px; box-shadow:var(--shadow); position:relative;
    border-left:4px solid var(--accent);
  }
  .hero-label{font-size:11.5px; font-weight:800; color:var(--accent); letter-spacing:.5px; text-transform:uppercase;}
  .hero-route{font-size:20px; font-weight:800; margin-top:2px; letter-spacing:.2px;}
  .hero-trains{margin-top:15px; display:flex; flex-direction:column; gap:9px;}
  .hero-train{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px 12px 11px;
    cursor:pointer; border-left:4px solid var(--sub); transition:background .12s;
  }
  .hero-train:active{opacity:.6;}
  .tt-express{ border-left-color:#c9622c; }
  .tt-fast{ border-left-color:#3a8f9e; }
  .tt-local{ border-left-color:#3a8f5c; }
  .hero-train .l{font-size:13.5px; font-weight:600; min-width:0;}
  .ttRow{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .hero-train .l small{display:block; font-size:11.5px; color:var(--sub); font-weight:500; margin-top:4px;}
  .hero-train .r{font-size:19.5px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums; color:var(--accent); flex-shrink:0; margin-left:10px;}
  .hero-empty{margin-top:14px; font-size:13px; color:var(--sub);}
  .delayBadge{
    font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px; letter-spacing:.2px;
  }
  .delayBadge.ontime{ background:var(--accent-soft); color:var(--good); }
  .delayBadge.late{ background:var(--accent-soft); color:var(--bad); }

  /* ---- generic card ---- */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .card-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .card-title{display:flex; align-items:center; gap:10px; min-width:0; width:100%;}
  .card-titletext{min-width:0; flex:1;}
  .tag{
    font-size:11px; font-weight:800; color:#fff; border-radius:7px; padding:4px 8px;
    flex-shrink:0;
  }
  .card-name{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-sub{font-size:12px; color:var(--sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gearbtn{background:var(--bg); border:1px solid var(--border); color:var(--sub); font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:8px; flex-shrink:0;}
  .gearbtn:active{opacity:.6;}
  .gearbtn.ghost{color:var(--bad); border-color:var(--bad);}
  /* 公車卡片的編輯／刪除按鈕獨立一列放在卡片最下面，不跟站名同一行搶空間，
     不管站名多長都不會被按鈕擋住，每張卡片的按鈕位置也都固定對齊。 */
  .busActions{
    display:flex; justify-content:flex-end; gap:8px;
    margin-top:11px; padding-top:11px; border-top:1px solid var(--border);
  }
  .card.clickable{cursor:pointer;}
  .card.clickable:active{opacity:.75;}
  .clickable{cursor:pointer;}
  .clickable:active{opacity:.7;}
  .chev{color:var(--sub); font-size:18px; flex-shrink:0;}
  .card.addroute{cursor:pointer; text-align:center; border-style:dashed; color:var(--accent); font-weight:700; font-size:14px;}
  .card.addroute:active{opacity:.6;}

  .etalist{display:flex; gap:8px; margin-top:11px; flex-wrap:wrap;}
  /* 固定寬度，不再依內容（例如站名長短）自動撐大——每個到站方塊統一以最寬的情況為準，
     視覺上才會整齊對齊，不會有些方塊看起來比較大、有些比較小。 */
  .eta{
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 10px; width:78px; box-sizing:border-box; text-align:center; flex-shrink:0;
  }
  .eta .min{font-size:17px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1.2;}
  .eta .min.soon{color:var(--good);}
  .eta .min.late{color:var(--sub);}
  .eta .cap{font-size:10.5px; color:var(--sub); margin-top:2px; white-space:normal; line-height:1.25;}

  /* 公車站牌＋時間的「一列一站」模組：站名跟時間在同一行，左右對齊，
     不用像方塊排法那樣自己對應上面的站名跟下面的數字。 */
  .busStopList{
    margin-top:11px; border:1px solid var(--border); border-radius:var(--radius-sm);
    overflow:hidden;
  }
  .busStopRow{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 12px; background:var(--bg);
  }
  .busStopRow + .busStopRow{ border-top:1px solid var(--border); }
  .busStopName{ font-size:13.5px; font-weight:600; min-width:0; }
  .busStopTime{
    font-size:16.5px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums;
    flex-shrink:0; text-align:right;
  }
  .busStopTime.soon{ color:var(--good); }
  .busStopTime.late{ color:var(--sub); font-size:12px; }

  .muted{color:var(--sub); font-size:13px; padding:8px 2px;}
  .err{color:var(--bad); font-size:12.5px; padding:8px 2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .err button{background:var(--bad); color:#fff; border:none; border-radius:8px; font-size:11.5px; font-weight:700; padding:5px 10px;}
  .skeleton{height:44px; border-radius:var(--radius-sm); background:linear-gradient(90deg, var(--bg) 25%, var(--border) 37%, var(--bg) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite;}
  @keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:0 0} }

  .footer{text-align:center; color:var(--sub); font-size:11.5px; margin-top:22px; line-height:1.7;}

  /* ---- modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,18,16,.5); display:none;
    align-items:flex-end; z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card); width:100%; max-height:82vh; border-radius:22px 22px 0 0;
    padding:16px 18px calc(18px + env(safe-area-inset-bottom)); overflow-y:auto;
    animation:up .2s ease-out; max-width:560px; margin:0 auto;
  }
  @keyframes up{from{transform:translateY(20px); opacity:.4} to{transform:translateY(0); opacity:1}}
  .sheet h2{font-size:16.5px; margin:0 0 4px; font-weight:800;}
  .sheet p.hint{font-size:12.5px; color:var(--sub); margin:0 0 12px;}
  .stopitem{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 2px; border-bottom:1px solid var(--border); font-size:14px;
  }
  .stopitem .n{font-weight:600;}
  .stopitem .d{font-size:11.5px; color:var(--sub); margin-top:1px;}
  .stopitem button{
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    font-size:12px; padding:7px 13px; font-weight:700; flex-shrink:0;
  }
  .stopitem button:disabled{ background:var(--border); color:var(--sub); }
  .stopitem.picked button{background:var(--good);}
  .closebar{display:flex; justify-content:flex-end; margin-bottom:4px;}
  .closebar button{background:none; border:none; color:var(--sub); font-size:14px; padding:8px;}
  .searchRow{ display:flex; gap:8px; margin-bottom:12px; }
  .searchRow input{
    flex:1; min-width:0; padding:11px 13px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px;
  }
  .searchRow button{
    background:var(--accent); color:#fff; border:none; border-radius:12px; padding:0 18px;
    font-weight:700; flex-shrink:0; font-size:14px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1><span class="sectionIcon" id="icon-orange" style="margin-right:6px; vertical-align:-3px;"></span>天繃開橘</h1>
    <div class="sub" id="modeHint">載入中…</div>
  </div>
  <button class="iconbtn" id="refreshBtn" title="重新整理">⟳</button>
</div>

<div class="modeSwitch" id="modeSwitch">
  <button class="modeBtn" data-mode="go">去程</button>
  <button class="modeBtn" data-mode="back">回程</button>
</div>
<div class="updatedRow" id="updatedRow">載入中…</div>

<!-- TRA -->
<div class="hero">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <div class="hero-label"><span class="sectionIcon" id="icon-tra"></span>台鐵</div>
      <div class="hero-route" id="traRouteLabel">—</div>
    </div>
    <button class="rangeBtn" id="traRangeBtn">自訂區間</button>
  </div>
  <div class="hero-trains" id="traTrains">
    <div class="skeleton"></div>
  </div>
</div>

<div class="section-title"><span class="sectionIcon" id="icon-krtc"></span>高雄捷運</div>
<div id="krtcCards"></div>

<div class="section-title"><span class="sectionIcon" id="icon-bus"></span>公車</div>
<div id="busCards"></div>

<div class="section-title"><span class="sectionIcon" id="icon-bike"></span>YouBike</div>
<div id="youbikeCard"></div>

<div class="footer">
  資料來源：TDX 運輸資料流通服務平臺<br>每 30 秒自動更新（背景時暫停）· 點卡片看更多細節
</div>

<!-- Shared bottom sheet modal -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="closebar"><button id="closeSheet">關閉 ✕</button></div>
    <h2 id="sheetTitle">詳細資訊</h2>
    <p class="hint" id="sheetHint" style="display:none;"></p>
    <div id="sheetBody"><div class="muted">載入中…</div></div>
  </div>
</div>

<script>
/* ====================== 自動偵測舊版本、強制更新 ======================
   iPhone Safari「加入主畫面」的頁面沒有位址列，使用者沒辦法手動下拉重新整理，
   Safari 又常常把整份 HTML 快取住不重新抓——結果就是主畫面圖示長期停在很舊的版本，
   之前修好的 bug（例如公車 StopStatus 判斷反了）在他們手機上其實「還沒修好」，
   因為根本沒抓到新版程式碼。這裡每次打開頁面都會用 no-store 重新跟伺服器要一次
   最新的 index.html，比對版本字串，不一樣就自動強制重新整理一次拿到最新版，
   不用使用者自己想辦法清快取。 */
const APP_VERSION = '2026091711';
(function selfUpdateCheck(){
  try{
    const guardKey = 'appVersionReloadGuard';
    fetch(location.pathname + '?_v=' + Date.now(), { cache:'no-store' })
      .then(r=> r.ok ? r.text() : null)
      .then(html=>{
        if(!html) return;
        const m = html.match(/const APP_VERSION = '([^']+)'/);
        if(!m) return;
        const latest = m[1];
        if(latest !== APP_VERSION && sessionStorage.getItem(guardKey) !== latest){
          sessionStorage.setItem(guardKey, latest); // 避免版本抓取異常時無限重新整理
          location.reload();
        }
      })
      .catch(()=>{}); // 抓不到就算了，不影響現在這份還能不能動
  }catch(e){}
})();

/* ====================== 設定區 ====================== */
const TDX_CLIENT_ID = 'M144040015-6d10b8c1-4e17-4a74';
const TDX_CLIENT_SECRET = 'cff4b35c-2152-4564-a5f5-dcd38c8608ec';
const TDX_AUTH_URL = 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
const TDX_API = 'https://tdx.transportdata.tw/api/basic';

const TRA_STATIONS = { KAOHSIUNG: '4400', PINGTUNG: '5000' };
// Direction 1 = 南下(高雄→屏東方向), Direction 0 = 北上(屏東→高雄方向)
const TRA_DIRECTIONS = {
  go:   { fromStation: TRA_STATIONS.PINGTUNG,  toStation: TRA_STATIONS.KAOHSIUNG, direction: 0, label: '屏東 → 高雄' },
  back: { fromStation: TRA_STATIONS.KAOHSIUNG, toStation: TRA_STATIONS.PINGTUNG,  direction: 1, label: '高雄 → 屏東' }
};

// 不分去程／回程，哈瑪星、美麗島、高雄車站三站都能選。
// 美麗島是橘線／紅線的轉乘站，橘線那側叫 O5、紅線那側叫 R10，兩個 ID 都要查才會抓到雙線的班次。
const KRTC_STATIONS = [
  { key:'hamasen',  name:'哈瑪星',   ids:['O1'],       line:'橘線' },
  { key:'meilidao', name:'美麗島',   ids:['O5','R10'], line:'橘線・紅線' },
  { key:'kstation', name:'高雄車站', ids:['R11'],      line:'紅線' }
];
const KRTC_ALL_STATION_IDS = KRTC_STATIONS.flatMap(s=>s.ids);
// 去程不需要哈瑪星、回程不需要高雄車站，各自只留兩個真正用得到的分頁。
const KRTC_ORDER = {
  go:   ['kstation','meilidao'],
  back: ['hamasen','meilidao']
};
function krtcStationsInOrder(){
  return KRTC_ORDER[getMode()].map(k=>KRTC_STATIONS.find(s=>s.key===k));
}
function krtcDefaultStation(){
  return KRTC_ORDER[getMode()][0];
}
let selectedKrtcStation = 'hamasen'; // 會在 currentMode 初始化後由 krtcDefaultStation() 校正

const DEFAULT_BUS_ROUTES = [
  { key:'o1',  name:'橘1',      tag:'橘1',   color:'#d98a2b' },
  { key:'o1e', name:'橘1延',    tag:'橘1延', color:'#e0a64a' },
  { key:'r52', name:'紅52',     tag:'紅52',  color:'#c1443f' },
  { key:'w50', name:'50五福幹線', tag:'五福幹線', color:'#7c6fae' }
];
const ROUTE_COLORS = ['#d98a2b','#c1443f','#7c6fae','#3a8f9e','#3a8f5c','#b8791f','#b85c86','#4472c4'];

function getBusRoutes(){
  const saved = JSON.parse(localStorage.getItem('busRoutes') || 'null');
  if(saved) return saved;
  localStorage.setItem('busRoutes', JSON.stringify(DEFAULT_BUS_ROUTES));
  return DEFAULT_BUS_ROUTES.slice();
}
function saveBusRoutes(list){
  localStorage.setItem('busRoutes', JSON.stringify(list));
}
function addBusRoute(name){
  const list = getBusRoutes();
  if(list.some(r=>r.name===name)) return;
  const color = ROUTE_COLORS[list.length % ROUTE_COLORS.length];
  const key = 'r_' + Date.now();
  list.push({ key, name, tag:name, color });
  saveBusRoutes(list);
}
function removeBusRoute(key){
  saveBusRoutes(getBusRoutes().filter(r=>r.key!==key));
  localStorage.removeItem('busStop_'+key+'_go');
  localStorage.removeItem('busStop_'+key+'_back');
}

/* ====================== 去程／回程模式 ====================== */
function autoDetectMode(){
  return 'go'; // 每次打開網頁固定先顯示去程
}
let currentMode = autoDetectMode();
selectedKrtcStation = krtcDefaultStation();
function getMode(){ return currentMode; }
function setMode(m){
  currentMode = m;
  selectedKrtcStation = krtcDefaultStation();
  renderModeUI();
  renderTraFromCache(); // 立刻畫出這個模式上次抓到的資料，不用等新的網路請求
  renderAll();
  refreshAll();
}
function renderModeUI(){
  document.querySelectorAll('.modeBtn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.mode === currentMode);
  });
  const hints = {
    go:   '走囉！出發當牛馬囉～',
    back: '回家啃老囉～'
  };
  document.getElementById('modeHint').textContent = hints[currentMode];
}

/* ====================== Token ====================== */
async function getToken(){
  const cached = JSON.parse(localStorage.getItem('tdx_token') || 'null');
  if (cached && cached.expiresAt > Date.now() + 60000) return cached.token;
  const res = await fetch(TDX_AUTH_URL, {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({
      grant_type:'client_credentials',
      client_id:TDX_CLIENT_ID,
      client_secret:TDX_CLIENT_SECRET
    })
  });
  if(!res.ok) throw new Error('TDX 授權失敗');
  const json = await res.json();
  const data = { token: json.access_token, expiresAt: Date.now() + json.expires_in*1000 };
  localStorage.setItem('tdx_token', JSON.stringify(data));
  return data.token;
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

/* ====================== 分層快取：先畫舊資料，網路資料到了再換新 ======================
   第 1 層（0ms）：畫面一開就從 localStorage 讀「上一次成功抓到的資料」直接畫出來，
                    不用等任何網路請求，切換去程/回程、切捷運分頁也是先讀這層。
   第 2 層（背景）：refreshAll() 照常打 API，成功後才覆蓋畫面、同時把新資料存回這層快取。
   這樣「反應速度」跟「降低 API 呼叫頻率」兩件事可以分開處理，不用互相犧牲。 */
const CACHE_PREFIX = 'cache_v1_';
function saveCache(key, data){
  try{ localStorage.setItem(CACHE_PREFIX+key, JSON.stringify({ t: Date.now(), data })); }catch(e){}
}
function loadCache(key, maxAgeMs){
  try{
    const raw = localStorage.getItem(CACHE_PREFIX+key);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(maxAgeMs && (Date.now() - parsed.t) > maxAgeMs) return null;
    return parsed.data;
  }catch(e){ return null; }
}

// 併發限制池：同一時間最多 MAX_CONCURRENT 個請求真正在飛，不再用「每個請求都要間隔
// 900 毫秒才發下一個」這種強制排隊方式——那是拖慢速度、也是「點按鈕卡頓」的主因，
// 因為使用者的操作得排在整條隊伍最後面才會發送。現在背景更新的幾個請求會平行送出，
// 使用者互動的操作（high）一律插隊最優先拿到名額，不用等背景任務。
const MAX_CONCURRENT = 3;
let activeCount = 0;
let waitQueue = [];

function queueRequest(task, priority){
  return new Promise((resolve, reject)=>{
    const item = { task, resolve, reject };
    if(priority === 'high'){
      let idx = waitQueue.findIndex(i=> !i.high);
      if(idx === -1) idx = waitQueue.length;
      waitQueue.splice(idx, 0, Object.assign(item, {high:true}));
    } else {
      waitQueue.push(item);
    }
    pumpQueue();
  });
}

function pumpQueue(){
  while(activeCount < MAX_CONCURRENT && waitQueue.length){
    const item = waitQueue.shift();
    activeCount++;
    item.task().then(item.resolve, item.reject).finally(()=>{
      activeCount--;
      pumpQueue();
    });
  }
}

async function tdxGetRaw(path){
  const token = await getToken();
  const res = await fetch(TDX_API + path + (path.includes('?')?'&':'?') + '$format=JSON', {
    headers:{ Authorization:'Bearer '+token, Accept:'application/json' }
  });
  if(res.status === 429){
    const err = new Error('查詢太頻繁，稍後再試');
    err.isRateLimit = true;
    throw err;
  }
  if(!res.ok) throw new Error('資料取得失敗 ('+res.status+')');
  return res.json();
}

// priority: 'high' 給使用者正在等的互動操作（跳到背景刷新前面），不傳就是背景排程用的一般順序。
async function tdxGet(path, priority){
  return queueRequest(async ()=>{
    let delay = 1500;
    for(let attempt=0; attempt<4; attempt++){
      try{
        return await tdxGetRaw(path);
      }catch(e){
        if(e.isRateLimit && attempt < 3){
          await sleep(delay);
          delay *= 2;
          continue;
        }
        throw e;
      }
    }
  }, priority);
}

/* ====================== 小工具 ====================== */
function minutesFrom(dateStr){

}
function fmtMin(m){ return m<=0 ? '進站' : m+'分'; }
function etaClass(m){ return m<=2 ? 'soon' : (m>=15 ? 'late' : ''); }

function errBox(msg, retryFn){

/* ====================== 台鐵 ====================== */
// 每個模式（去程／回程）各自保留「上一次成功抓到」的班次，
// 之後刷新失敗時就顯示這份舊資料＋小提示，而不是整塊變成錯誤畫面卡住畫面。
let lastTraTrainsByMode = {};

// 車資表幾乎不會變，快取 7 天。全天班表用「日期」當快取 key，過了當天自然失效重抓。
const TRA_FARE_TTL = 7*24*3600*1000;
let lastTraFareByMode = {};
let lastTraODByMode = {};

function fareCodeForTrainType(name){
  if(name.includes('自強') || name.includes('普悠瑪') || name.includes('太魯閣')) return '自';
  if(name.includes('莒光')) return '莒';
  if(name.includes('區間') || name.includes('復興')) return '復'; // 區間／區間快目前跟復興號同一票價級距
  return '普'; // 普快等其餘車種
}
function fareForTrainType(fares, trainTypeName){
  if(!fares) return null;
  const entry = fares.find(f=> f.TicketType === '成'+fareCodeForTrainType(trainTypeName));
  return entry ? entry.Price : null;
}
async function ensureTraFare(mode, priority){
  const cfg = TRA_DIRECTIONS[mode];
  const key = 'traFare_'+cfg.fromStation+'_'+cfg.toStation;
  const cached = loadCache(key, TRA_FARE_TTL);
  if(cached){ lastTraFareByMode[mode] = cached; return cached; }
  const data = await tdxGet(`/v2/Rail/TRA/ODFare/${cfg.fromStation}/to/${cfg.toStation}`, priority);
  const fares = (data && data[0] && data[0].Fares) || [];
  lastTraFareByMode[mode] = fares;
  saveCache(key, fares);
  return fares;
}
async function ensureTraOD(mode, priority){
  const today = new Date().toISOString().slice(0,10);
  const data = await fetchTraODForDate(mode, today, priority);
  lastTraODByMode[mode] = data;
  return data;
}
// 給「自訂時間往後查詢」用：可以指定任意日期，跟 ensureTraOD（永遠查今天、給即時卡片用）分開，
// 不會互相污染快取內容。日期相同時共用同一份快取，不會重複打 API。
async function fetchTraODForDate(mode, date, priority){
  const cfg = TRA_DIRECTIONS[mode];
  const key = 'traOD_'+mode+'_'+date;
  const cached = loadCache(key);
  if(cached) return cached;
  const data = await tdxGet(`/v2/Rail/TRA/DailyTimetable/OD/${cfg.fromStation}/to/${cfg.toStation}/${date}`, priority);
  saveCache(key, data || []);
  return data || [];
}
function findArrivalTime(mode, trainNo){
  const od = lastTraODByMode[mode];
  if(!od) return null;
  const entry = od.find(t=> t.DailyTrainInfo.TrainNo === trainNo);
  return entry ? entry.DestinationStopTime.ArrivalTime.slice(0,5) : null;
}
// 車資、全天班表都不影響當下要不要畫班次，背景抓、抓到才補畫一次即可。
function enrichTraInBackground(mode){
  Promise.all([ ensureTraFare(mode), ensureTraOD(mode) ]).then(()=>{
    if(mode === getMode() && lastTraTrainsByMode[mode]) renderTraTrains(lastTraTrainsByMode[mode], false);
  }).catch(()=>{});
}

// 車種原始名稱常常有一堆備註，例如「自強(推拉式自強號且有自行車車廂)」「自強(3000)(EMU3000 型電車)」，
// 但保留簡短的車型代號（例如「(3000)」「(PP)」）比全部拿掉更有辨識度——
// 推拉式自強號縮寫成「PP」是台鐵迷慣用的稱呼。分類判斷（trainTypeClass／fareCodeForTrainType）
// 仍然吃未處理過的原始名稱，因為關鍵字都在括號「之前」，不受影響。
function cleanTrainTypeName(name){
  const base = name.split('(')[0].trim();
  const groups = [...name.matchAll(/\(([^)]*)\)/g)].map(m=>m[1]);
  let tag = groups.find(g=> /^\d+$/.test(g)); // 純數字車型代號，例如「3000」
  if(!tag && groups.some(g=> g.includes('推拉'))) tag = 'PP';
  return tag ? `${base}(${tag})` : base;
}
// 簡約豎槓分色：自強(含普悠瑪/太魯閣) / 區間快 / 區間，其餘車種用預設中性色。
function trainTypeClass(name){
  if(name.includes('自強') || name.includes('普悠瑪') || name.includes('太魯閣')) return 'tt-express';
  if(name.includes('區間快')) return 'tt-fast';
  if(name.includes('區間')) return 'tt-local';
  return '';
}
// 用發車時間＋抵達時間算行車時間，跨過午夜（抵達時刻比發車時刻小）就自動加一天。
function formatDuration(depHHMM, arrHHMM){
  if(!depHHMM || !arrHHMM) return null;
  const [dh,dm] = depHHMM.split(':').map(Number);
  const [ah,am] = arrHHMM.split(':').map(Number);
  let diff = (ah*60+am) - (dh*60+dm);
  if(diff < 0) diff += 24*60;
  const h = Math.floor(diff/60), m = diff%60;
  return h>0 ? `${h}小時${m}分` : `${m}分`;
}

function renderTraTrains(trains, stale, errMsg){
  const el = document.getElementById('traTrains');
  if(!trains.length){
    el.innerHTML = '<div class="hero-empty">目前沒有查到班次</div>';
    return;
  }
  const mode = getMode();
  const fares = lastTraFareByMode[mode];
  el.innerHTML = trains.map(t=>{
    const delayBadge = t.DelayTime>0
      ? `<span class="delayBadge late">誤點${t.DelayTime}分</span>`
      : `<span class="delayBadge ontime">準點</span>`;
    const price = fareForTrainType(fares, t.TrainTypeName.Zh_tw);
    const dep = t.ScheduledDepartureTime.slice(0,5);
    const arr = findArrivalTime(mode, t.TrainNo);
    const duration = formatDuration(dep, arr);
    const bits = [price!=null?('$'+price):null, arr?('抵達 '+arr):null, duration?('車程 '+duration):null].filter(Boolean).join(' · ');
    return `<div class="hero-train ${trainTypeClass(t.TrainTypeName.Zh_tw)}" data-trainno="${t.TrainNo}">
      <div class="l">
        <div class="ttRow">${cleanTrainTypeName(t.TrainTypeName.Zh_tw)} ${t.TrainNo} ${delayBadge}</div>
        <small>${bits}</small>
      </div>
      <div class="r">${dep}</div>
    </div>`;
  }).join('') + (stale ? `<div class="staleNote">更新失敗，顯示上次資料${errMsg?'（'+errMsg+'）':''}</div>` : '');
  el.querySelectorAll('.hero-train').forEach(row=>{
    row.onclick = ()=> openTrainDetail(row.dataset.trainno);
  });
}

// 畫面第 1 層：直接用記憶體裡（來自 localStorage 或前一次抓取）的資料同步畫出來，不等網路。
function renderTraFromCache(){
  const mode = getMode();
  const cfg = TRA_DIRECTIONS[mode];
  document.getElementById('traRouteLabel').textContent = cfg.label;
  const cached = lastTraTrainsByMode[mode];
  if(cached && cached.length){
    renderTraTrains(cached, false);
    enrichTraInBackground(mode);
  } else {
    document.getElementById('traTrains').innerHTML = '<div class="skeleton"></div>';
  }
}

async function loadTRA(){
  const el = document.getElementById('traTrains');
  const mode = getMode(); // 記住這次是為了哪個模式查的
  const cfg = TRA_DIRECTIONS[mode];
  if(mode === getMode()) document.getElementById('traRouteLabel').textContent = cfg.label;
  try{
    const data = await tdxGet(`/v2/Rail/TRA/LiveBoard/Station/${cfg.fromStation}`);
    const trains = (data||[])
      .filter(t => t.Direction === cfg.direction)
      .sort((a,b)=> a.ScheduledDepartureTime.localeCompare(b.ScheduledDepartureTime))
      .slice(0,3);
    lastTraTrainsByMode[mode] = trains;
    saveCache('tra_'+mode, trains);
    // 這通請求發出去之後，使用者可能已經切到另一個模式了——
    // 這種「慢半拍」的回應只更新快取，畫面交給目前真正在顯示的模式處理，不能蓋過去。
    if(mode === getMode()){
      renderTraTrains(trains, false);
      enrichTraInBackground(mode);
    }
  }catch(e){
    if(mode !== getMode()) return;
    const cached = lastTraTrainsByMode[mode];
    if(cached && cached.length){
      renderTraTrains(cached, true, e.message);
    } else {
      el.innerHTML = errBox(e.message, loadTRA);
    }
  }
}

/* ---- 台鐵：從指定時間往後查詢（用當天完整時刻表，非即時誤點） ---- */
const TRA_FORWARD_LIMIT = 15; // 只列出往後最近 15 班，避免清單太長

async function openTraRangePicker(){

  `;

    try{
      const [data, fares] = await Promise.all([ fetchTraODForDate(mode, date, 'high'), ensureTraFare(mode, 'high') ]);
      const list = (data||[])
        .filter(t=> t.OriginStopTime.DepartureTime.slice(0,5) >= from)
        .sort((a,b)=> a.OriginStopTime.DepartureTime.localeCompare(b.OriginStopTime.DepartureTime))
        .slice(0, TRA_FORWARD_LIMIT);
      if(!list.length){ results.innerHTML = '<div class="muted">這個時間之後沒有查到班次了</div>'; return; }
      results.innerHTML = list.map(t=>{
        const info = t.DailyTrainInfo;
        const price = fareForTrainType(fares, info.TrainTypeName.Zh_tw);
        const depT = t.OriginStopTime.DepartureTime.slice(0,5);
        const arrT = t.DestinationStopTime.ArrivalTime.slice(0,5);
        const duration = formatDuration(depT, arrT);
        return `<div class="stopitem ${trainTypeClass(info.TrainTypeName.Zh_tw)}" style="border-left-width:4px; border-left-style:solid; padding-left:10px;">

          </div>
          <div style="font-weight:800; color:var(--accent);">${depT}</div>
        </div>`;
      }).join('');
    }catch(e){
      results.innerHTML = errBox(e.message, doForwardSearch);
    }
  };
  document.getElementById('rangeSearchBtn').onclick = doForwardSearch;
}

// 只顯示：列車分級與班次、上車時間、抵達時間、票價 —— 不再列出沿途每一站，
// 而且直接沿用已經快取的全天班表／車資，通常完全不用等網路（開過一次同模式後幾乎都是秒開）。
async function openTrainDetail(trainNo){
  document.getElementById('sheetTitle').textContent = '車次 ' + trainNo;
  document.getElementById('sheetHint').style.display = 'none';
  const body = document.getElementById('sheetBody');
  const mode = getMode();
  overlay.classList.add('show');

  const renderDetail = (entry, fares, stale)=>{
    const info = entry.DailyTrainInfo;
    const price = fareForTrainType(fares, info.TrainTypeName.Zh_tw);
    const depT = entry.OriginStopTime.DepartureTime.slice(0,5);
    const arrT = entry.DestinationStopTime.ArrivalTime.slice(0,5);
    const duration = formatDuration(depT, arrT);
    body.innerHTML = `
      <div class="stopitem ${trainTypeClass(info.TrainTypeName.Zh_tw)}" style="border-left-width:4px; border-left-style:solid; padding-left:10px;"><div><div class="n">車種／車次</div></div><div style="font-weight:800;">${cleanTrainTypeName(info.TrainTypeName.Zh_tw)} ${trainNo}</div></div>
      <div class="stopitem"><div><div class="n">上車時間</div><div class="d">${entry.OriginStopTime.StationName.Zh_tw}</div></div><div style="font-weight:800; color:var(--accent);">${depT}</div></div>
      <div class="stopitem"><div><div class="n">抵達時間</div><div class="d">${entry.DestinationStopTime.StationName.Zh_tw}</div></div><div style="font-weight:800; color:var(--accent);">${arrT}</div></div>
      ${duration ? `<div class="stopitem"><div><div class="n">行車時間</div></div><div style="font-weight:800;">${duration}</div></div>` : ''}
      <div class="stopitem"><div><div class="n">全票票價</div></div><div style="font-weight:800;">${price!=null ? '$'+price : '—'}</div></div>
      ${info.Note && info.Note.Zh_tw ? `<p class="hint" style="margin-top:10px;">${info.Note.Zh_tw}</p>` : ''}
      ${stale ? `<div class="staleNote">更新失敗，顯示上次資料</div>` : ''}
    `;
  };

  const cachedOD = lastTraODByMode[mode];
  const cachedFares = lastTraFareByMode[mode];
  const cachedEntry = cachedOD && cachedOD.find(t=> t.DailyTrainInfo.TrainNo === trainNo);
  if(cachedEntry){ renderDetail(cachedEntry, cachedFares); } // 第 1 層：有快取秒開
  else { body.innerHTML = '<div class="muted">載入中…</div>'; }

  try{
    const [od, fares] = await Promise.all([ ensureTraOD(mode, 'high'), ensureTraFare(mode, 'high') ]);
    const entry = (od||[]).find(t=> t.DailyTrainInfo.TrainNo === trainNo);
    if(!entry){
      if(!cachedEntry) body.innerHTML = '<div class="muted">查無這班車的資料</div>';
      return;
    }
    renderDetail(entry, fares);
  }catch(e){
    if(cachedEntry){ renderDetail(cachedEntry, cachedFares, true); }
    else { body.innerHTML = errBox(e.message, ()=>openTrainDetail(trainNo)); }
  }
}

// 末班車前後，KRTC 會出現「往高雄車站」這種目的地剛好等於「你現在所在站」的班次——
// 不是資料錯誤或程式 bug，是這班車本來就是「開到這站就結束、不再往前」的收班車。
// 原本直接照 TripHeadSign 顯示會讓人誤以為打錯字或抓錯資料，這裡把這種自己等於自己的
// 情形換成更好懂的說法。
function krtcHeadsignLabel(headsign, stationName){
  if(headsign === '往'+stationName) return '本站為終點';
  return headsign;
}

function renderKrtcFromCache(stale, errMsg){
  const box = document.getElementById('krtc-eta');
  if(!box) return;
  if(!lastKrtcData){ box.innerHTML = '<div class="skeleton"></div>'; return; }
  const st = KRTC_STATIONS.find(s=>s.key===selectedKrtcStation);
  const trains = lastKrtcData.filter(t=> st.ids.includes(t.StationID));
  const byHead = {};
  trains.forEach(t=>{
    if(!(t.TripHeadSign in byHead) || t.EstimateTime < byHead[t.TripHeadSign].EstimateTime){
      byHead[t.TripHeadSign] = t;
    }
  });
  const list = Object.values(byHead).sort((a,b)=> a.EstimateTime - b.EstimateTime);
  if(!list.length){ box.innerHTML = '<div class="muted">目前沒有班次資訊</div>'; return; }
  box.innerHTML = list.map(t=>{
    const m = t.EstimateTime; // 已經是分鐘
    return `<div class="eta">
      <div class="min ${etaClass(m)}">${krtcMinuteLabel(m)}</div>
      <div class="cap">${krtcHeadsignLabel(t.TripHeadSign, st.name)}</div>
    </div>`;
  }).join('') + (stale ? `<div class="staleNote">更新失敗，顯示上次資料${errMsg?'（'+errMsg+'）':''}</div>` : '');
}

async function loadKRTC(){
  const box = document.getElementById('krtc-eta');
  if(!box) return;
  try{
    const filter = KRTC_ALL_STATION_IDS.map(id=>`StationID eq '${id}'`).join(' or ');
    const data = await tdxGet(`/v2/Rail/Metro/LiveBoard/KRTC?$filter=${encodeURIComponent(filter)}`);
    lastKrtcData = data || [];
    saveCache('krtc', lastKrtcData);
    renderKrtcFromCache();
  }catch(e){
    if(lastKrtcData){
      renderKrtcFromCache(true, e.message);
    } else {
      box.innerHTML = errBox(e.message, loadKRTC);
    }
  }
}

const krtcStationInfoCache = {};
async function getKrtcStationInfo(stationId){
  if(krtcStationInfoCache[stationId]) return krtcStationInfoCache[stationId];
  const cached = JSON.parse(localStorage.getItem('krtcInfo_'+stationId) || 'null');
  if(cached){ krtcStationInfoCache[stationId] = cached; return cached; }
  const data = await tdxGet(`/v2/Rail/Metro/Station/KRTC?$filter=${encodeURIComponent(`StationID eq '${stationId}'`)}`, 'high');
  const info = (data && data[0]) || null;
  krtcStationInfoCache[stationId] = info;
  localStorage.setItem('krtcInfo_'+stationId, JSON.stringify(info));
  return info;
}

async function openKrtcDetail(stationKey){
  const st = KRTC_STATIONS.find(s=>s.key===stationKey);
  document.getElementById('sheetTitle').textContent = st.name + ' 站資訊';
  document.getElementById('sheetHint').style.display = 'none';
  const body = document.getElementById('sheetBody');
  body.innerHTML = '<div class="muted">載入中…</div>';
  overlay.classList.add('show');
  try{
    // 站點資訊有本機快取；到站時刻直接沿用最近一次抓到的資料，不額外打 API。
    const infos = await Promise.all(st.ids.map(getKrtcStationInfo));
    const trains = (lastKrtcData||[]).filter(t=> st.ids.includes(t.StationID)).sort((a,b)=> a.EstimateTime - b.EstimateTime);
    let html = '';
    const addr = infos.find(i=>i && i.StationAddress);
    if(addr) html += `<p class="hint">地址：${addr.StationAddress}</p>`;
    html += trains.length ? trains.map(t=>{
      const m = t.EstimateTime;
      return `<div class="stopitem">
        <div><div class="n">${krtcHeadsignLabel(t.TripHeadSign, st.name)}</div><div class="d">${(t.LineName&&t.LineName.Zh_tw)||''}</div></div>
        <div style="font-weight:800; color:var(--accent);">${krtcMinuteLabel(m)}</div>
      </div>`;
    }).join('') : '<div class="muted">目前沒有班次資訊，請先按重新整理</div>';
    body.innerHTML = html;
  }catch(e){
    body.innerHTML = errBox(e.message, ()=>openKrtcDetail(stationKey));
  }
}

/* ====================== 公車 ====================== */
// 一條路線在同一個模式下可以同時設定「多個」站牌（例如橘1回程要同時列出
// 中山大學行政大樓、活動中心）。舊資料是存單一物件，這裡自動相容成陣列。
function getPickedStops(routeKey, mode){
  mode = mode || getMode();
  const raw = JSON.parse(localStorage.getItem('busStop_'+routeKey+'_'+mode) || 'null');
  if(!raw) return [];
  return Array.isArray(raw) ? raw : [raw];
}
function setPickedStops(routeKey, mode, stops){
  localStorage.setItem('busStop_'+routeKey+'_'+mode, JSON.stringify(stops));
}
function toggleStopPick(routeKey, mode, stop){
  const stops = getPickedStops(routeKey, mode);
  const idx = stops.findIndex(s=>s.StopUID===stop.StopUID);
  if(idx>=0){ stops.splice(idx,1); } else { stops.push(stop); }
  setPickedStops(routeKey, mode, stops);
  return stops;
}
// 多個站牌名稱有共同開頭時（例如「中山大學行政大樓」／「中山大學活動中心」），
// 到站方塊的小標籤把共同的部分省略掉，顯示「行政大樓」／「活動中心」就好，比較精簡。
function shortStopLabels(stops){
  if(stops.length <= 1) return stops.map(s=>s.StopName);
  let prefix = stops[0].StopName;
  stops.forEach(s=>{
    while(prefix && !s.StopName.startsWith(prefix)) prefix = prefix.slice(0,-1);
  });
  return prefix.length >= 2 ? stops.map(s=> s.StopName.slice(prefix.length) || s.StopName) : stops.map(s=>s.StopName);
}

function renderBusSkeleton(){

  const routes = getBusRoutes();

  const modeLabel = mode==='go' ? '去程' : '回程';
  wrap.innerHTML = routes.map(r=>{
    const picked = getPickedStops(r.key, mode);
    const hasPicked = picked.length > 0;
    return `<div class="card" id="bus-${r.key}">
      <div class="card-head">
        <div class="card-title">
          <span class="tag" style="background:${r.color}">${r.tag}</span>
          <div class="card-titletext">
            <div class="card-sub" style="margin-top:0;">${hasPicked ? modeLabel : modeLabel+'尚未選站牌'}</div>
          </div>
        </div>
      </div>
      <div class="busStopList" id="bus-eta-${r.key}">${hasPicked ? '<div class="skeleton"></div>' : '<div class="muted">點齒輪設定</div>'}</div>
      <div class="busActions">
        <button class="gearbtn" data-route="${r.key}" data-act="edit">編輯站牌</button>
        <button class="gearbtn ghost" data-route="${r.key}" data-act="del">刪除路線</button>
      </div>
    </div>`;
  }).join('') + `
    <div class="card addroute" id="addRouteCard">＋ 新增公車路線</div>`;
  wrap.querySelectorAll('.gearbtn[data-act="edit"]').forEach(btn=>{
    btn.onclick = ()=> openStopPicker(btn.dataset.route);
  });
  wrap.querySelectorAll('.gearbtn[data-act="del"]').forEach(btn=>{
    btn.onclick = ()=>{
      const r = routes.find(x=>x.key===btn.dataset.route);
      if(confirm(`確定要移除「${r?r.tag:''}」這條路線嗎？（去程／回程站牌都會一起刪除）`)){
        removeBusRoute(btn.dataset.route);
        renderBusSkeleton();
      }
    };
  });
  document.getElementById('addRouteCard').onclick = openAddRoute;

  // 第 1 層：有快取到站資料的路線先畫出來，不用等這次的網路請求。
  routes.forEach(r=>{
    const picked = getPickedStops(r.key, mode);
    if(!picked.length) return;
    const labels = shortStopLabels(picked);
    const entries = picked.map((s,i)=>({ label:labels[i], stop: lastBusStopData[r.key+'_'+mode+'_'+s.StopUID] }));
    if(entries.some(e=>e.stop !== undefined)){
      renderBusEtaList(document.getElementById('bus-eta-'+r.key), entries);
    }
  });
}

// StopStatus 官方定義：0=正常, 1=尚未發車, 2=交管不停靠, 3=末班車已過, 4=今日未營運。
// 排查「除了某條路線其他都顯示沒資料」的問題時發現：那些「沒資料」的路線在當下時間點
// 是真的末班車已過、今日沒車了（StopStatus 3/4），不是程式壞掉。但原本一律顯示
// 「目前沒有預估到站資訊」，使用者沒辦法分辨是「壞了」還是「今天真的沒車了」。
// 現在依 StopStatus 給出明確原因，一眼就能判斷是不是程式問題。
const BUS_STATUS_NOTE = { 2:'交管不停靠', 3:'末班已過', 4:'今日未營運' };
// 站名跟到站時間放在「同一列」裡，左邊站名、右邊時間，一眼就能對起來，
// 不再是上面一排站名、下面一排數字兩邊脫鉤、要自己對應的排法。
function busStopRowHtml(label, stop){
  const hasTime = stop && (stop.EstimateTime != null || stop.NextBusTime);
  if(!hasTime){
    const note = (stop && BUS_STATUS_NOTE[stop.StopStatus]) || '無資訊';
    return `<div class="busStopRow"><div class="busStopName">${label}</div><div class="busStopTime late">${note}</div></div>`;
  }
  const m = stop.EstimateTime!=null ? Math.round(stop.EstimateTime/60) : minutesFrom(stop.NextBusTime);
  return `<div class="busStopRow"><div class="busStopName">${label}</div><div class="busStopTime ${etaClass(m)}">${fmtMin(m)}</div></div>`;
}
// entries: [{label, stop}]，一條路線設定了幾個站牌，就畫幾列。
function renderBusEtaList(box, entries, stale, errMsg){
  if(!box) return;
  if(!entries.length){ box.innerHTML = '<div class="muted">尚未設定站牌</div>'; return; }
  box.innerHTML = entries.map(({label, stop})=> busStopRowHtml(label, stop)).join('')
    + (stale ? `<div class="staleNote">更新失敗，顯示上次資料${errMsg?'（'+errMsg+'）':''}</div>` : '');
}

// key：routeKey + 模式 + StopUID -> 上一次成功抓到的到站物件，失敗時當備援顯示。
let lastBusStopData = {};
function persistBusCache(){ saveCache('busEta', lastBusStopData); }

async function loadBusEta(routeKey){
  const mode = getMode();
  const picked = getPickedStops(routeKey, mode);
  const box = document.getElementById('bus-eta-'+routeKey);
  if(!box) return;
  if(!picked.length){ box.innerHTML = '<div class="muted">尚未設定站牌</div>'; return; }
  try{
    const route = getBusRoutes().find(r=>r.key===routeKey);
    const filter = encodeURIComponent(`RouteName/Zh_tw eq '${route.name}'`);
    const data = await tdxGet(`/v2/Bus/EstimatedTimeOfArrival/City/Kaohsiung?$filter=${filter}`, 'high');
    const labels = shortStopLabels(picked);
    const entries = picked.map((p,i)=>{
      const stop = (data||[]).find(s=> s.StopUID === p.StopUID) || null;
      lastBusStopData[routeKey+'_'+mode+'_'+p.StopUID] = stop;
      return { label: labels[i], stop };
    });
    persistBusCache();
    // 回應回來時模式可能已經切換了，慢半拍的結果只存快取，畫面交給目前的模式處理。
    if(mode === getMode()) renderBusEtaList(box, entries);
  }catch(e){
    if(mode !== getMode()) return;
    const labels = shortStopLabels(picked);
    const entries = picked.map((p,i)=>({ label:labels[i], stop: lastBusStopData[routeKey+'_'+mode+'_'+p.StopUID] }));
    if(entries.some(en=>en.stop !== undefined)){ renderBusEtaList(box, entries, true, e.message); }
    else { box.innerHTML = errBox(e.message, ()=>loadBusEta(routeKey)); }
  }
}

async function loadAllBusEta(){
  const mode = getMode();
  const routes = getBusRoutes();
  const withStop = []; // 攤平成「每個路線、每個站牌」一筆
  routes.forEach(r=>{
    const picked = getPickedStops(r.key, mode);
    const box = document.getElementById('bus-eta-'+r.key);
    if(!box) return;
    if(!picked.length){ box.innerHTML = '<div class="muted">尚未設定站牌</div>'; return; }
    const labels = shortStopLabels(picked);
    picked.forEach((p,i)=> withStop.push({ route:r, stop:p, label:labels[i], box }));
  });
  if(!withStop.length) return;
  try{
    const uids = [...new Set(withStop.map(x=>x.stop.StopUID))];
    const filter = uids.map(uid=>`StopUID eq '${uid}'`).join(' or ');
    const data = await tdxGet(`/v2/Bus/EstimatedTimeOfArrival/City/Kaohsiung?$filter=${encodeURIComponent(filter)}`);
    const stillCurrent = mode === getMode();
    withStop.forEach(({route, stop})=>{
      const s = (data||[]).find(x=>x.StopUID===stop.StopUID);
      lastBusStopData[route.key+'_'+mode+'_'+stop.StopUID] = s || null;
    });
    persistBusCache();
    if(stillCurrent){
      routes.forEach(r=>{
        const entries = withStop.filter(x=>x.route.key===r.key).map(x=>({ label:x.label, stop:lastBusStopData[r.key+'_'+mode+'_'+x.stop.StopUID] }));
        if(entries.length) renderBusEtaList(document.getElementById('bus-eta-'+r.key), entries);
      });
    }
  }catch(e){
    if(mode !== getMode()) return;
    routes.forEach(r=>{
      const items = withStop.filter(x=>x.route.key===r.key);
      if(!items.length) return;
      const entries = items.map(x=>({ label:x.label, stop:lastBusStopData[r.key+'_'+mode+'_'+x.stop.StopUID] }));
      if(entries.some(en=>en.stop !== undefined)){ renderBusEtaList(items[0].box, entries, true, e.message); }
      else { items[0].box.innerHTML = errBox(e.message, loadAllBusEta); }
    });
  }
}

/* ====================== YouBike ====================== */
// 打開網頁就自動定位、自動抓「使用者現在所在城市」的站點，不限高雄——
// 用使用者座標比對 TDX 有 YouBike 資料的各縣市大概中心點，抓最近的那個縣市。
const YOUBIKE_CITIES = [
  { city:'Taipei',        lat:25.0330, lon:121.5654 },
  { city:'NewTaipei',     lat:25.0120, lon:121.4657 },
  { city:'Taoyuan',       lat:24.9936, lon:121.3010 },
  { city:'Hsinchu',       lat:24.8138, lon:120.9675 },
  { city:'HsinchuCounty', lat:24.8387, lon:121.0177 },
  { city:'MiaoliCounty',  lat:24.5602, lon:120.8214 },
  { city:'Taichung',      lat:24.1477, lon:120.6736 },
  { city:'ChanghuaCounty',lat:24.0518, lon:120.5161 },
  { city:'YunlinCounty',  lat:23.7092, lon:120.4313 },
  { city:'Chiayi',        lat:23.4801, lon:120.4491 },
  { city:'ChiayiCounty',  lat:23.4518, lon:120.2555 },
  { city:'Tainan',        lat:22.9997, lon:120.2270 },
  { city:'Kaohsiung',     lat:22.6273, lon:120.3014 },
  { city:'PingtungCounty',lat:22.5519, lon:120.5487 },
  { city:'TaitungCounty', lat:22.7583, lon:121.1444 }
];
function nearestYoubikeCity(lat, lon){
  let best = null, bestDist = Infinity;
  YOUBIKE_CITIES.forEach(c=>{
    const d = haversineMeters(lat, lon, c.lat, c.lon);
    if(d < bestDist){ bestDist = d; best = c.city; }
  });
  return best;
}

// 站點清單（名稱、座標）變動很少，依城市快取 7 天；即時可借/可還數每次刷新才重抓。
let youbikeStations = null;
let youbikeStationsCity = null;
let lastYoubikeAvail = null;
let userGeo = null;
const YOUBIKE_STATIONS_TTL = 7*24*3600*1000;

async function getYoubikeStations(city, priority){
  if(youbikeStations && youbikeStationsCity === city) return youbikeStations;
  const key = 'youbikeStations_'+city;
  const cached = loadCache(key, YOUBIKE_STATIONS_TTL);
  if(cached){ youbikeStations = cached; youbikeStationsCity = city; return youbikeStations; }
  const data = await tdxGet(`/v2/Bike/Station/City/${city}?$top=1200`, priority);
  youbikeStations = data || [];
  youbikeStationsCity = city;
  saveCache(key, youbikeStations);
  return youbikeStations;
}

function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function requestGeo(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => resolve(null),
      { timeout: 8000, maximumAge: 60000 }
    );
  });
}

// 開頁就自動要求定位一次（瀏覽器原生權限彈窗，只需要同意一次，之後不會再問）。
async function autoLocateYouBike(){
  if(userGeo) return; // 已經有快取的位置了，refreshAll 會照常用它更新
  const wrap = document.getElementById('youbikeCard');
  if(wrap && !wrap.innerHTML.trim()) wrap.innerHTML = '<div class="card"><div class="skeleton"></div></div>';
  const geo = await requestGeo();
  if(!geo){
    if(wrap) wrap.innerHTML = `<div class="card">
      <div class="muted">無法取得定位，請在瀏覽器的網站設定裡允許定位權限後重新整理頁面</div>
      <button class="locateBtn" id="youbikeLocateBtn" style="margin-top:8px;">重試定位</button>
    </div>`;
    const btn = document.getElementById('youbikeLocateBtn');
    if(btn) btn.onclick = autoLocateYouBike;
    return;
  }
  userGeo = geo;
  saveCache('youbikeGeo', userGeo);
  await loadYouBike();
}

function renderYoubikeCard(stale, errMsg){
  const wrap = document.getElementById('youbikeCard');
  if(!wrap) return;
  if(!userGeo){
    wrap.innerHTML = '<div class="card"><div class="skeleton"></div></div>';
    return;
  }
  if(!youbikeStations || !lastYoubikeAvail){
    wrap.innerHTML = '<div class="card"><div class="skeleton"></div></div>';
    return;
  }
  const availByUid = {};
  lastYoubikeAvail.forEach(a=>{ availByUid[a.StationUID] = a; });
  const nearby = youbikeStations
    .map(s=>({ s, dist: haversineMeters(userGeo.lat, userGeo.lon, s.StationPosition.PositionLat, s.StationPosition.PositionLon) }))
    .sort((a,b)=> a.dist - b.dist)
    .slice(0,5);
  wrap.innerHTML = nearby.map(({s, dist})=>{
    const a = availByUid[s.StationUID];
    const detail = a && a.AvailableRentBikesDetail;
    const general = detail ? detail.GeneralBikes : null;
    const electric = detail ? detail.ElectricBikes : null;
    const rent = a ? a.AvailableRentBikes : null;
    const ret = a ? a.AvailableReturnBikes : null;
    const distLabel = dist < 1000 ? Math.round(dist)+' 公尺' : (dist/1000).toFixed(1)+' 公里';
    return `<div class="card">
      <div class="card-head">
        <div class="card-title">
          <div>
            <div class="card-name">${s.StationName.Zh_tw.replace('YouBike2.0_','')}</div>
            <div class="card-sub">距離約 ${distLabel}</div>
          </div>
        </div>
      </div>
      <div class="etalist">
        <div class="eta"><div class="min ${general>0?'soon':'late'}">${general==null?(rent==null?'—':rent):general}</div><div class="cap">一般車</div></div>
        <div class="eta"><div class="min ${electric>0?'soon':'late'}">${electric==null?'—':electric}</div><div class="cap">電輔車</div></div>
        <div class="eta"><div class="min">${ret==null?'—':ret}</div><div class="cap">可還空位</div></div>
      </div>
    </div>`;
  }).join('') + (stale ? `<div class="staleNote">更新失敗，顯示上次資料${errMsg?'（'+errMsg+'）':''}</div>` : '');
}

async function loadYouBike(){
  if(!userGeo) return; // 還沒定位成功就先跳過，不耗額度；autoLocateYouBike() 成功後會自己補一次
  // 每次背景更新也重新定位一次：不然只有可借還數字在跳，人明明在移動、附近站點清單卻永遠不變。
  // 瀏覽器端的定位不佔 TDX 額度，maximumAge 也讓它盡量沿用剛剛的定位結果、不會頻繁重新抓 GPS。
  const freshGeo = await requestGeo();
  if(freshGeo){ userGeo = freshGeo; saveCache('youbikeGeo', userGeo); }
  const city = nearestYoubikeCity(userGeo.lat, userGeo.lon);
  try{
    await getYoubikeStations(city);
    const data = await tdxGet(`/v2/Bike/Availability/City/${city}?$top=1200`);
    lastYoubikeAvail = data || [];
    saveCache('youbikeAvail', lastYoubikeAvail);
    renderYoubikeCard();
  }catch(e){
    if(lastYoubikeAvail){ renderYoubikeCard(true, e.message); }
    else {
      const wrap = document.getElementById('youbikeCard');
      wrap.innerHTML = errBox(e.message, loadYouBike);
    }
  }
}

/* ---- 站牌選擇 modal ---- */
const overlay = document.getElementById('overlay');
document.getElementById('closeSheet').onclick = ()=> overlay.classList.remove('show');
overlay.onclick = (e)=>{ if(e.target===overlay) overlay.classList.remove('show'); };

// 公車站牌清單幾乎不會變，快取 24 小時。同一條路線第二次以後打開站牌選擇，
// 完全不用等網路、也不會再消耗一次查詢額度。
const BUS_STOPS_TTL = 24*3600*1000;

// 可以同時選多個站牌（例如橘1回程要同時列出行政大樓、活動中心），
// 點一下切換已選／未選，不會自動關掉視窗，選完按下面的「完成」再收合。
function renderStopPickerList(data, routeKey, mode){
  const body = document.getElementById('sheetBody');
  const picked = getPickedStops(routeKey, mode);
  const byDir = {};
  (data||[]).forEach(s=>{
    byDir[s.Direction] = byDir[s.Direction] || [];
    byDir[s.Direction].push(s);
  });
  let html = '';
  Object.keys(byDir).sort().forEach(dir=>{
    const list = byDir[dir].sort((a,b)=>a.StopSequence-b.StopSequence);
    const terminus = list[list.length-1].StopName.Zh_tw;
    html += `<div class="section-title" style="margin-top:14px;">往 ${terminus} 方向</div>`;
    html += list.map(s=>{
      const isPicked = picked.some(p=>p.StopUID===s.StopUID);
      return `<div class="stopitem${isPicked?' picked':''}">
        <div>
          <div class="n">${s.StopName.Zh_tw}</div>
          <div class="d">第 ${s.StopSequence} 站</div>
        </div>
        <button data-uid="${s.StopUID}">${isPicked?'已選':'選擇'}</button>
      </div>`;
    }).join('');
  });
  html += `<button class="fullBtn" id="stopPickerDoneBtn" style="margin-top:16px;">完成（已選 ${picked.length} 站）</button>`;
  body.innerHTML = html || '<div class="muted">查無站牌資料</div>';
  body.querySelectorAll('button[data-uid]').forEach(btn=>{
    btn.onclick = ()=>{
      const s = data.find(x=>x.StopUID===btn.dataset.uid);
      toggleStopPick(routeKey, mode, { StopUID: s.StopUID, StopName: s.StopName.Zh_tw, seq: s.StopSequence });
      renderStopPickerList(data, routeKey, mode); // 重新畫一次，更新已選狀態跟完成按鈕的數量
      renderBusSkeleton();
      loadBusEta(routeKey);
    };
  });
  const doneBtn = document.getElementById('stopPickerDoneBtn');
  if(doneBtn) doneBtn.onclick = ()=> overlay.classList.remove('show');
}

// 防止連點：同一條路線如果已經有一個請求在飛，重複點擊不會再送出第二個，
// 只會沿用正在跑的那一個，等它回來就好——這是「設定站牌時查詢過多」的主要成因之一。
let stopPickerInFlightKey = null;

async function openStopPicker(routeKey){
  const route = getBusRoutes().find(r=>r.key===routeKey);
  const mode = getMode();
  const modeLabel = mode==='go' ? '去程' : '回程';
  document.getElementById('sheetTitle').textContent = route.name + ' — 選擇' + modeLabel + '站牌';
  const hint = document.getElementById('sheetHint');
  hint.style.display = 'block';
  hint.textContent = `選你${modeLabel}時上車的站牌，之後首頁只顯示這一站的到站時間（去程／回程可各自設定不同站牌）。`;
  const body = document.getElementById('sheetBody');
  overlay.classList.add('show');

  const cacheKey = 'busStops_'+route.name;
  const cached = loadCache(cacheKey, BUS_STOPS_TTL);
  if(cached){
    renderStopPickerList(cached, routeKey, mode); // 第 1 層：有快取立刻畫出來
  } else {
    body.innerHTML = '<div class="muted">載入中…</div>';
  }

  if(stopPickerInFlightKey === routeKey) return; // 同一條路線已經有請求在跑，不要再送第二個
  stopPickerInFlightKey = routeKey;
  try{
    const filter = encodeURIComponent(`RouteName/Zh_tw eq '${route.name}'`);
    const data = await tdxGet(`/v2/Bus/EstimatedTimeOfArrival/City/Kaohsiung?$filter=${filter}`, 'high');
    saveCache(cacheKey, data);
    // 拿到資料時使用者可能已經切去看別條路線了，這種情況只更新快取，不要蓋掉畫面。
    if(document.getElementById('sheetTitle').textContent.startsWith(route.name)){
      renderStopPickerList(data, routeKey, mode);
    }
  }catch(e){
    if(!cached && document.getElementById('sheetTitle').textContent.startsWith(route.name)){
      body.innerHTML = errBox(e.message, ()=>openStopPicker(routeKey));
    }
    // 有快取的話就維持已經畫出來的清單，站牌名單本來就很少變動，不用特別顯示錯誤打擾使用者。
  } finally {
    if(stopPickerInFlightKey === routeKey) stopPickerInFlightKey = null;
  }
}

/* ---- 新增路線 ---- */
async function openAddRoute(){
  document.getElementById('sheetTitle').textContent = '新增公車路線';
  document.getElementById('sheetHint').style.display = 'none';
  const body = document.getElementById('sheetBody');
  body.innerHTML = `
    <div class="searchRow">
      <input id="routeSearchInput" type="text" placeholder="輸入路線名稱，例如 88" inputmode="search">
      <button id="routeSearchBtn">搜尋</button>
    </div>
    <div id="routeSearchResults" class="muted">輸入路線名稱後按搜尋（僅限高雄市區公車路線）</div>
  `;
  overlay.classList.add('show');
  const input = document.getElementById('routeSearchInput');
  input.focus();
  const doSearch = async ()=>{
    const kw = input.value.trim();
    const results = document.getElementById('routeSearchResults');
    if(!kw){ results.innerHTML = '<div class="muted">請輸入關鍵字</div>'; return; }
    results.innerHTML = '<div class="muted">搜尋中…</div>';
    try{
      const filter = encodeURIComponent(`contains(RouteName/Zh_tw,'${kw}')`);
      const data = await tdxGet(`/v2/Bus/Route/City/Kaohsiung?$filter=${filter}&$top=15`, 'high');
      if(!data || !data.length){ results.innerHTML = '<div class="muted">查無符合的路線</div>'; return; }
      const existing = getBusRoutes().map(r=>r.name);
      results.innerHTML = data.map(r=>{
        const name = r.RouteName.Zh_tw;
        const op = (r.Operators && r.Operators[0] && r.Operators[0].OperatorName.Zh_tw) || '';
        const already = existing.includes(name);
        return `<div class="stopitem">
          <div><div class="n">${name}</div><div class="d">${op}</div></div>
          <button data-name="${name}" ${already?'disabled':''}>${already?'已加入':'加入'}</button>
        </div>`;
      }).join('');
      results.querySelectorAll('button[data-name]').forEach(btn=>{
        btn.onclick = ()=>{
          addBusRoute(btn.dataset.name);
          overlay.classList.remove('show');
          renderBusSkeleton();
          refreshAll();
        };
      });
    }catch(e){
      results.innerHTML = errBox(e.message, doSearch);
    }
  };
  document.getElementById('routeSearchBtn').onclick = doSearch;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
}

/* ====================== 主流程 ====================== */
function renderAll(){
  renderKrtcSkeleton();
  renderBusSkeleton();
  renderYoubikeCard();
}

let isRefreshing = false;
async function refreshAll(){
  if(isRefreshing) return;
  isRefreshing = true;
  const row = document.getElementById('updatedRow');
  row.textContent = '更新中…';
  document.getElementById('refreshBtn').classList.add('spin');
  try{
    // 四組請求都會經過 tdxGet 的全站佇列，自動排隊、間隔發送，
    // 這裡直接平行呼叫即可，不需要再手動加延遲。YouBike 在還沒取得定位權限前
    // 會直接跳過、不耗用額度。
    await Promise.all([ loadTRA(), loadKRTC(), loadAllBusEta(), loadYouBike() ]);
  } finally {
    isRefreshing = false;
    document.getElementById('refreshBtn').classList.remove('spin');
  }
  row.innerHTML = `最後更新 ${nowStr()} <button id="manualRefresh">重新整理</button>`;
  document.getElementById('manualRefresh').onclick = refreshAll;
}

document.getElementById('refreshBtn').onclick = refreshAll;
document.getElementById('traRangeBtn').onclick = openTraRangePicker;
document.querySelectorAll('.modeBtn').forEach(btn=>{
  btn.onclick = ()=> setMode(btn.dataset.mode);
});

// 開頁的第一件事：把 localStorage 裡「上一次成功抓到的資料」全部讀進記憶體，
// 這樣底下的 renderAll() 就能立刻畫出東西，不用乾等第一次的網路請求跑完。
function hydrateFromCache(){
  lastTraTrainsByMode.go = loadCache('tra_go') || null;
  lastTraTrainsByMode.back = loadCache('tra_back') || null;
  lastKrtcData = loadCache('krtc') || null;
  lastBusStopData = loadCache('busEta') || {};
  lastYoubikeAvail = loadCache('youbikeAvail') || null;
  userGeo = loadCache('youbikeGeo', 30*60*1000) || null; // 定位快取只留 30 分鐘，太久沒重新定位怕位置不準
}

// 使用者指定的固定站牌（去程一律捷運哈瑪星站出口1；回程依路線分別停靠中山大學行政大樓／隧道口）。
// 用版本字串控制只套用一次：套用過的瀏覽器不會被重複覆蓋，之後使用者自己改的站牌不會被蓋掉；
// 之後如果要再次強制套用新的固定站牌，把 BUS_STOP_PRESETS_VERSION 往上跳一版即可。
const BUS_STOP_PRESETS_VERSION = 'v2';
const BUS_STOP_PRESETS = {
  go: {
    o1:  [{ StopUID:'KHH100901143241', StopName:'捷運哈瑪星站(出口1)(輕軌哈瑪星站)', seq:2 }],
    o1e: [{ StopUID:'KHH109011143241', StopName:'捷運哈瑪星站(出口1)(輕軌哈瑪星站)', seq:2 }],
    r52: [{ StopUID:'KHH10085215981',  StopName:'捷運哈瑪星站(出口1)(輕軌哈瑪星站)', seq:16 }],
    w50: [{ StopUID:'KHH10005090721',  StopName:'捷運哈瑪星站(出口1)(輕軌哈瑪星站)', seq:24 }]
  },
  back: {
    // 橘1回程同時列出行政大樓、活動中心兩站。
    o1:  [
      { StopUID:'KHH10090131852',  StopName:'中山大學行政大樓', seq:6 },
      { StopUID:'KHH100901192512', StopName:'中山大學活動中心', seq:5 }
    ],
    o1e: [{ StopUID:'KHH10901131852',  StopName:'中山大學行政大樓', seq:6 }],
    r52: [{ StopUID:'KHH100852190122', StopName:'中山大學行政大樓', seq:1 }],
    w50: [{ StopUID:'KHH10005018431',  StopName:'中山大學(隧道口)', seq:26 }]
  }
};
function applyBusStopPresetsOnce(){
  const key = 'busPresetsApplied';
  if(localStorage.getItem(key) === BUS_STOP_PRESETS_VERSION) return;
  ['go','back'].forEach(mode=>{
    Object.keys(BUS_STOP_PRESETS[mode]).forEach(routeKey=>{
      setPickedStops(routeKey, mode, BUS_STOP_PRESETS[mode][routeKey]);
    });
  });
  localStorage.setItem(key, BUS_STOP_PRESETS_VERSION);
}

hydrateFromCache();
applyBusStopPresetsOnce();
injectIcons();
renderModeUI();
renderTraFromCache();
renderAll();
refreshAll();
autoLocateYouBike(); // 打開網頁就自動要求定位，不用使用者按按鈕

// 每 30 秒觸發一次，但畫面不在前景、或使用者正打開某個彈窗（例如選站牌）時跳過——
// 使用者正在等的操作已經走 high 優先權排到最前面了，背景這輪就不要再去搶額度、拖累它。
const AUTO_REFRESH_MS = 30000;
setInterval(()=>{
  if(document.visibilityState === 'visible' && !overlay.classList.contains('show')) refreshAll();
}, AUTO_REFRESH_MS);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') refreshAll();
});
</script>
